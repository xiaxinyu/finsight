# Production profile — set all secrets via environment variables (no defaults).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

account:
  des-sign-key: ${ACCOUNT_DES_SIGN_KEY}

finsight:
  security:
    csrf-enabled: true
    actuator-public: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
