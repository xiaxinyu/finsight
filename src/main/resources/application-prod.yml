# Production profile — set all secrets via environment variables (no defaults).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

account:
  des-sign-key: ${ACCOUNT_DES_SIGN_KEY}

finsight:
  security:
    csrf-enabled: true
    actuator-public: false
    login-max-attempts: 8
    login-lockout-seconds: 900

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
