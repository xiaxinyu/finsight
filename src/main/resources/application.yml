# Mybatis
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml  #注意：一定要对应mapper映射xml文件的所在路径
  # 实体扫描，多个package用逗号或者分号分隔
  type-aliases-package: com.finsight.domain.model.*
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      idType: AUTO
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 10
    out-of-order: true
    locations: classpath:db/migration
    validate-on-migrate: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/finsight?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    hikari:
      minimum-idle: 3
      idle-timeout: 600000
      maximum-pool-size: 15
      auto-commit: true
      pool-name: Finsight-HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

account:
  des-sign-key: ${ACCOUNT_DES_SIGN_KEY:change-me-in-env}

finsight:
  features:
    transfers: true
  classification:
    import-other-fallback: false
  # Feature flags — see docs/tech/FEATURE_FLAGS.md
  planning:
    persist: false          # true: budgets/bills/goals persist to MySQL (dual-run with in-memory store)
  advisor:
    enabled: true           # false: /api/v1/advisor/recommendations returns 404
    local-ai-enabled: true  # false: /api/v1/advisor/ask returns 404
  profile:
    enabled: true           # false: /api/v1/analytics/profile returns 404; hides Profile nav
  forecast:
    enabled: true           # false: forecast/trends/scenarios/cash-risk APIs return 404
  merchant-mining:
    enabled: true           # false: /api/v1/advisor/merchants/* returns 404
  metrics:
    reconcile-gate: false   # true: block advisor metrics when reconciliation fails
  analytics:
    profile-cache-ttl-seconds: 600   # 10 min — warm GET /analytics/profile
    advisor-cache-ttl-seconds: 600   # 10 min — warm GET /advisor/recommendations
    forecast-cache-ttl-seconds: 600  # 10 min — forecast preview GET paths
    profile-snapshot-scheduler-enabled: false  # true: daily 02:00 snapshot persist per ledger user
    profile-snapshot-cron: "0 0 2 * * *"
  security:
    csrf-enabled: false
    actuator-public: true

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    maxHttpHeaderSize: 65536
