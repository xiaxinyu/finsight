<html>
<head>
    <title>== Category Types ==</title>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.min.js"></script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.easyui.min.js"></script>
    <script type="text/javascript" src="/scripts/app-plugin.js"></script>
    <script type="text/javascript" src="/scripts/finsight-ui.js"></script>
    <script type="text/javascript" src="/scripts/admin-ui.js"></script>
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/bootstrap/easyui.css">
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/icon.css">
    <link rel="stylesheet" type="text/css" href="/css/finsight-ui.css">
    <link rel="stylesheet" type="text/css" href="/css/default/admin/AdminConsole.css">
    <style>
        .readonly-field .textbox-text,
        .textbox-readonly .textbox-text{
            background-color: rgba(148,163,184,0.18) !important;
            color: var(--text-sub) !important;
        }
    </style>
</head>
<body class="easyui-layout">
<div data-options="region:'north',border:false" class="admin-topbar">
    <a class="easyui-linkbutton" data-options="iconCls:'icon-add'" onclick="addRoot()">Add Root</a>
    <a class="easyui-linkbutton" data-options="iconCls:'icon-add'" onclick="addChild()">Add Child</a>
    <a class="easyui-linkbutton fs-btn-primary" data-options="iconCls:'icon-save'" onclick="saveCategory()">Save</a>
    <a class="easyui-linkbutton" data-options="iconCls:'icon-remove'" onclick="deleteCategory()">Delete</a>
    <a class="easyui-linkbutton" data-options="iconCls:'icon-redo'" onclick="migrateCategory()">Migrate</a>
    <a class="easyui-linkbutton" data-options="iconCls:'icon-reload'" onclick="reloadTree()">Reload Tree</a>
    <span id="hint" class="admin-hint">Select a node on the left to edit</span>
</div>

<div data-options="region:'west',border:false" class="admin-tree-panel">
    <ul id="tree" class="easyui-tree" data-options="url:'/api/v1/consume/tree',method:'get'"></ul>
    <input type="hidden" id="hidParentId" />
</div>

<div data-options="region:'center',border:false" class="admin-center-panel">
    <div class="admin-form-card">
        <div class="admin-form-row" style="display:none;">
            <label class="admin-form-label">ID</label>
            <input id="txtId" class="easyui-textbox" style="width:380px;" readonly>
        </div>
        <div class="admin-form-row">
            <label class="admin-form-label">Parent Code</label>
            <input id="txtParent" class="easyui-textbox readonly-field" style="width:380px;" data-options="readonly:true">
        </div>
        <div class="admin-form-row">
            <label class="admin-form-label">Parent Name</label>
            <input id="txtParentName" class="easyui-textbox readonly-field" style="width:380px;" data-options="readonly:true">
        </div>
        <div class="admin-form-row">
            <label class="admin-form-label">Code</label>
            <input id="txtCode" class="easyui-textbox" style="width:380px;">
        </div>
        <div class="admin-form-row">
            <label class="admin-form-label">Name</label>
            <input id="txtName" class="easyui-textbox" style="width:380px;">
        </div>
        <div class="admin-form-row">
            <label class="admin-form-label">Sort</label>
            <input id="numSort" class="easyui-numberbox" style="width:120px;" data-options="min:0,precision:0">
        </div>
        <div class="admin-form-row">
            <label class="admin-form-label">Transaction Types</label>
            <input id="cmbTxnTypes" class="easyui-combobox" style="width:380px;">
        </div>
        <div class="admin-form-row">
            <label class="admin-form-label">Cascade to credits</label>
            <input id="chkCascade" type="checkbox">
        </div>
        <div class="admin-form-row">
            <label class="admin-form-label">Migrate To</label>
            <select id="cmbTarget" class="easyui-combotree" style="width:300px;" data-options="url:'/api/v1/consume/tree',method:'get'"></select>
            <a class="easyui-linkbutton" data-options="iconCls:'icon-search'" onclick="pickCurrentTarget()">Pick current</a>
        </div>
        <div class="admin-form-row">
            <label class="admin-form-label">Delete after migrate</label>
            <input id="chkDeleteAfter" type="checkbox">
        </div>
    </div>
</div>

<script type="text/javascript">
var tree = '#tree';
var currentNode = null;
var currentCat = null;
var categoriesCache = [];
var txnTypesOptions = [
    {id:'expense',text:'Expense'},
    {id:'income',text:'Income'},
    {id:'transfer',text:'Transfer'},
    {id:'refund',text:'Refund'},
    {id:'adjustment',text:'Adjustment'},
    {id:'invest',text:'Investment'},
    {id:'other',text:'Other'}
];

$(function(){
    $(tree).tree({
        url:'/api/v1/consume/tree',
        method:'get',
        onLoadSuccess:function(){ $(tree).tree('collapseAll'); },
        onSelect:function(node){ loadNode(node); }
    });
        $('#cmbTarget').combotree({
            url:'/api/v1/consume/tree',
            method:'get',
            loadFilter:function(data){
                function mapNode(n){
                    if(!n) return n;
                    var code = n.id || '';
                    var name = n.text || '';
                    n.text = (code ? code : '') + (name ? ('  ' + name) : '');
                if(n.children && n.children.length){ for(var i=0;i<n.children.length;i++){ n.children[i] = mapNode(n.children[i]); } }
                return n;
                }
                if($.isArray(data)){ for(var i=0;i<data.length;i++){ data[i] = mapNode(data[i]); } } else { data = mapNode(data); }
                return data;
            },
            onShowPanel:function(){ try{$('#cmbTarget').combotree('tree').tree('collapseAll');}catch(e){} }
        });
    applyReadonlyStyle();
    $('#cmbTxnTypes').combobox({
        data: txnTypesOptions,
        valueField: 'id',
        textField: 'text',
        multiple: true,
        panelHeight: 'auto'
    });
});

function fetchCategoryById(id, cb){
    if(categoriesCache && categoriesCache.length){
        var found = null;
        for(var i=0;i<categoriesCache.length;i++){ if(categoriesCache[i].id===id){ found = categoriesCache[i]; break; } }
        cb(found);
        return;
    }
    $.ajax({url:'/api/v1/consume/categories',type:'GET',success:function(res){
        categoriesCache = (res && res.rows) ? res.rows : [];
        var found = null;
        for(var i=0;i<categoriesCache.length;i++){ if(categoriesCache[i].id===id){ found = categoriesCache[i]; break; } }
        cb(found);
    }});
}

function fetchCategoryByCode(code, cb){
    if(categoriesCache && categoriesCache.length){
        var found = null;
        for(var i=0;i<categoriesCache.length;i++){ if(categoriesCache[i].code===code){ found = categoriesCache[i]; break; } }
        cb(found);
        return;
    }
    $.ajax({url:'/api/v1/consume/categories',type:'GET',success:function(res){
        categoriesCache = (res && res.rows) ? res.rows : [];
        var found = null;
        for(var i=0;i<categoriesCache.length;i++){ if(categoriesCache[i].code===code){ found = categoriesCache[i]; break; } }
        cb(found);
    }});
}

function setForm(cat){
    $('#txtId').textbox('setValue', cat && cat.id ? cat.id : '');
    $('#hidParentId').val(cat && cat.parentId ? cat.parentId : '');
    $('#txtParent').textbox('setValue', cat && cat.parentId ? cat.parentId : '');
    var parentName = '';
    if(cat && cat.parentId){
        fetchCategoryByCode(cat.parentId, function(p){ $('#txtParentName').textbox('setValue', p && p.name ? p.name : ''); });
    } else {
        $('#txtParentName').textbox('setValue','');
    }
    $('#txtCode').textbox('setValue', cat && cat.code ? cat.code : '');
    $('#txtName').textbox('setValue', cat && cat.name ? cat.name : '');
    $('#numSort').numberbox('setValue', cat && cat.sortNo!=null ? cat.sortNo : 0);
    try{
        var types = (cat && cat.txnTypes) ? $.trim(cat.txnTypes) : '';
        if(!types){ types = 'expense'; }
        var arr = types.split(',').filter(function(x){ return !!x; });
        $('#cmbTxnTypes').combobox('setValues', arr);
    }catch(e){}
    applyReadonlyStyle();
}

function getForm(){
    var id = $('#txtId').textbox('getValue');
    var parentId = $('#hidParentId').val();
    var code = $('#txtCode').textbox('getValue');
    var name = $('#txtName').textbox('getValue');
    var sortNo = $('#numSort').numberbox('getValue');
    var deleted = (currentCat && currentCat.deleted!=null) ? currentCat.deleted : 0;
    var txnTypes = '';
    try{ txnTypes = ($('#cmbTxnTypes').combobox('getValues')||[]).join(','); }catch(e){ txnTypes = ''; }
    if(!txnTypes){ txnTypes = 'expense'; }
    return {id:id, parentId:parentId, code:code, name:name, sortNo: parseInt(sortNo||'0'), deleted:deleted, txnTypes: txnTypes};
}

function loadNode(node){
    currentNode = node;
    fetchCategoryByCode(node.id, function(cat){ currentCat = cat; setForm(cat||{parentId:'',sortNo:0,deleted:0}); });
}

function addRoot(){
    currentNode = null;
    currentCat = {id:'',parentId:'',code:'',name:'',sortNo:0,deleted:0};
    setForm(currentCat);
}

function addChild(){
    if(!currentNode) return;
    var parentCode = currentCat && currentCat.code ? currentCat.code : '';
    currentCat = {id:'',parentId: parentCode, code:'', name:'', sortNo:0, deleted:0};
    setForm(currentCat);
}

function saveCategory(){
    var cat = getForm();
    var method = cat.id ? 'PUT' : 'POST';
    var cascade = $('#chkCascade').is(':checked');
    var url = '/api/v1/consume/categories' + (cat.id ? '/' + cat.id : '');
    if (cascade && method==='PUT') { url += '?cascade=true'; }
    $.ajax({url:url,type:method,contentType:'application/json',data:JSON.stringify(cat),dataType:'json',success:function(r){
        categoriesCache = [];
        $(tree).tree('reload');
        if(r && r.id){ $('#txtId').textbox('setValue', r.id); }
        adminUi.success(adminUi.C.categorySaved);
    },error:function(xhr){
        var text = xhr && xhr.responseText ? xhr.responseText : '';
        // Some servers/frameworks can still commit data even if the response is not parseable.
        // If we can recover a category-like JSON response, treat it as success to avoid false negatives.
        try{
            var parsed = JSON.parse(text || '{}');
            if(parsed && (parsed.id || parsed.code)){
                categoriesCache = [];
                $(tree).tree('reload');
                if(parsed.id){ $('#txtId').textbox('setValue', parsed.id); }
                adminUi.success(adminUi.C.categorySaved);
                return;
            }
        }catch(e){}

        var msg = text || 'Unable to save the category.';
        var isDup = (xhr && (xhr.status===409)) || (msg && (msg.indexOf('Duplicate')>=0));
        if(isDup){
            adminUi.fail('A category with the same ID or code already exists. Please use a unique value.');
        }else{
            adminUi.fail(msg);
        }
    }});
}

function deleteCategory(){
    var id = $('#txtId').textbox('getValue');
    var name = $('#txtName').textbox('getValue');
    if(!id) return;
    var childrenCount = 0;
    if(currentNode && currentNode.children && currentNode.children.length){ childrenCount = currentNode.children.length; }
    var msg = childrenCount>0
        ? ('Are you sure you want to delete "'+(name||id)+'" and its '+childrenCount+' child categories?')
        : ('Are you sure you want to delete "'+(name||id)+'"?');
    $.messager.confirm(adminUi.C.confirmDeletionTitle, msg, function(r){
        if(!r) return;
        $.ajax({url:'/api/v1/consume/categories/'+id,type:'DELETE',success:function(){
            setForm({parentId:'',sortNo:0,deleted:0});
            categoriesCache = [];
            $(tree).tree('reload');
            adminUi.success(adminUi.C.categoryDeleted);
        },error:function(xhr){ adminUi.fail((xhr && xhr.responseText) ? xhr.responseText : 'Unable to delete the category.'); }});
    });
}

function reloadTree(){ $(tree).tree('reload'); }

function applyReadonlyStyle(){
    try{
        $('#txtParent').textbox('readonly', true);
        $('#txtParentName').textbox('readonly', true);
        $('#txtParent').textbox('textbox').css({'background-color':'rgba(148,163,184,0.18)','color':'#4B5563'});
        $('#txtParentName').textbox('textbox').css({'background-color':'rgba(148,163,184,0.18)','color':'#4B5563'});
    }catch(e){}
}

function migrateCategory(){
    var id = $('#txtId').textbox('getValue');
    var name = $('#txtName').textbox('getValue');
    if(!id) return;
    var tgt = '';
    try{ tgt = $('#cmbTarget').combotree('getValue'); }catch(e){ tgt = ''; }
    if(!tgt){ adminUi.fail('Please select a target category.'); return; }
    var srcCode = $('#txtCode').textbox('getValue');
    if(srcCode && tgt && $.trim(srcCode) === $.trim(tgt)){
        adminUi.fail('The source and target categories are the same. No migration is required.');
        return;
    }
    var cascade = $('#chkCascade').is(':checked');
    var deleteAfter = $('#chkDeleteAfter').is(':checked');
    var url = '/api/v1/consume/categories/'+id+'/migrate?toCode='+encodeURIComponent(tgt)+'&deleteAfter='+(deleteAfter?'true':'false')+'&cascade='+(cascade?'true':'false');
    $.messager.confirm(adminUi.C.confirmMigrationTitle,'Move records from "'+(name||id)+'" to "'+tgt+'"'+(deleteAfter?' and delete the source category':'')+'?', function(r){
        if(!r) return;
        $.ajax({url:url,type:'POST',success:function(){
            categoriesCache = [];
            $(tree).tree('reload');
            setForm({parentId:'',sortNo:0,deleted:0});
            adminUi.success(adminUi.C.categoryMigrated);
        },error:function(xhr){ adminUi.fail((xhr && xhr.responseText) ? xhr.responseText : 'Unable to migrate category records.'); }});
    });
}

function pickCurrentTarget(){
    if(!currentNode){ adminUi.fail(adminUi.C.selectCategoryFirst); return; }
    try{
        $('#cmbTarget').combotree('setValue', currentNode.id);
    }catch(e){}
}
</script>

<div data-options="region:'south'" style="height:0;display:none;"></div>
</body>
</html>
