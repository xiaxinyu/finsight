<html>
<head>
    <title>== Bank Cards ==</title>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.min.js"></script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.easyui.min.js"></script>
    <script type="text/javascript" src="/scripts/app-plugin.js"></script>
    <script type="text/javascript" src="/scripts/admin-ui.js"></script>
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/bootstrap/easyui.css">
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/icon.css">
    <link rel="stylesheet" type="text/css" href="/css/default/admin/AdminConsole.css">
    <style>
        .cards-grid-wrap{
            height: 100%;
            padding: 8px 10px 10px;
            background: var(--bg-body);
        }
        #dg .datagrid-header{
            background: var(--header-bg) !important;
            border-bottom: 1px solid var(--border) !important;
        }
        #dg .datagrid-header .datagrid-cell{
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
            padding: 10px 8px;
        }
        #dg .datagrid-row-selected{
            background: var(--selected-bg) !important;
            color: var(--text-main) !important;
        }
        #dg .datagrid-row-over{ background: var(--hover-bg) !important; }
    </style>
</head>
<body class="easyui-layout">
<div data-options="region:'north',border:false" class="admin-topbar">
    <a class="easyui-linkbutton" data-options="iconCls:'icon-add'" onclick="addCard()">Add</a>
    <a class="easyui-linkbutton fs-btn-primary" data-options="iconCls:'icon-save'" onclick="saveCard()">Save</a>
    <a class="easyui-linkbutton" data-options="iconCls:'icon-remove'" onclick="deleteCard()">Delete</a>
    <span id="hint" class="admin-hint">Select a card type on the left</span>
</div>

<div data-options="region:'west',border:false" class="admin-tree-panel" style="width:280px;">
    <ul id="tree" class="easyui-tree" data-options="url:'/api/v1/cards/tree',method:'get'"></ul>
 </div>

<div data-options="region:'center',border:false" class="cards-grid-wrap">
    <table id="dg" fit="true" data-options="rownumbers:true,singleSelect:true,pagination:true,pageSize:50,idField:'id',fitColumns:true,striped:true,border:false">
        <thead>
        <tr>
            <th data-options="field:'id',width:160,hidden:true">ID</th>
            <th data-options="field:'bankCode',width:160,editor:{type:'textbox'}">Bank Code</th>
            <th data-options="field:'cardTypeCode',width:120,editor:{type:'combobox',options:{data:[{id:'credit',text:'credit'},{id:'debit',text:'debit'}],valueField:'id',textField:'text'}}">Type</th>
            <th data-options="field:'cardNo',width:160,editor:{type:'textbox'}">Card No</th>
            <th data-options="field:'cardName',width:220,editor:{type:'textbox'}">Card Name</th>
        </tr>
        </thead>
    </table>
</div>

<script type="text/javascript">
var tree = '#tree';
var dg = '#dg';
var editIndex;
var selectedTypeCode = '';
function getResultMessage(res, fallback){
    try{
        if(res && app.api && app.api.normalizeResult){
            var n = app.api.normalizeResult(res);
            if(n && n.message){ return n.message; }
        }
    }catch(e){}
    return (res && (res.message || res.returnMessage)) ? (res.message || res.returnMessage) : (fallback || adminUi.C.opFailed);
}
function normalizeRow(r){
    r = r || {};
    r.bankCode = (r.bankCode||'').trim();
    r.cardNo = (r.cardNo||'').trim();
    r.cardTypeCode = selectedTypeCode || r.cardTypeCode;
    if (r.deleted == null) { r.deleted = 0; }
    return r;
}

$(function(){
    $(tree).tree({
        url:'/api/v1/cards/tree',
        method:'get',
        onSelect:function(node){
            var n = node;
            if (n.children && n.children.length > 0){
                selectedTypeCode = n.id;
            } else {
                var p = $(tree).tree('getParent', n.target);
                selectedTypeCode = p ? p.id : '';
            }
            loadCards();
        }
    });
    $(dg).datagrid({
        method:'get',
        url:'/api/v1/cards',
        queryParams:{cardTypeCode:''},
        onClickRow:function(index){
            $(dg).datagrid('selectRow', index);
        },
        onDblClickRow:function(index){
            if (endEditing()){
                editIndex = index;
                $(dg).datagrid('selectRow', index).datagrid('beginEdit', index);
            }
        },
        onAfterEdit:function(index,row,changes){
            var r = normalizeRow(row);
            if(!r.bankCode || !r.cardTypeCode || !r.cardNo){
                adminUi.fail('Bank code, card type, and card number are required.');
                return;
            }
            var method = r.id ? 'PUT' : 'POST';
            var url = '/api/v1/cards' + (r.id ? '/' + r.id : '');
            $.ajax({url:url,type:method,contentType:'application/json',data:JSON.stringify(r)}).done(function(resp){
                $(dg).datagrid('acceptChanges');
                loadCards();
                adminUi.success(adminUi.C.cardSaved);
            }).fail(function(xhr){
                try{
                    var res = JSON.parse(xhr.responseText||'{}');
                    adminUi.fail(getResultMessage(res, 'Unable to save the card.'));
                }catch(e){ adminUi.fail('Unable to save the card.'); }
            });
        }
    });
});

function loadCards(){
    editIndex = undefined;
    $(dg).datagrid('load', {cardTypeCode:selectedTypeCode});
}

function endEditing(){
    if (editIndex == undefined){return true}
    if ($(dg).datagrid('validateRow', editIndex)){
        $(dg).datagrid('endEdit', editIndex);
        editIndex = undefined;
        return true;
    } else {return false}
}

function addCard(){
    if (!selectedTypeCode){ adminUi.fail(adminUi.C.selectCardTypeFirst); return; }
    if (endEditing()){
        $(dg).datagrid('appendRow',{bankCode:'',cardTypeCode:selectedTypeCode,cardNo:'',cardName:'',deleted:0});
        editIndex = $(dg).datagrid('getRows').length-1;
        $(dg).datagrid('selectRow', editIndex).datagrid('beginEdit', editIndex);
    }
}

function saveCard(){
    if (!endEditing()) return;
}

function deleteCard(){
    var row = $(dg).datagrid('getSelected');
    if (!row || !row.id){ adminUi.fail(adminUi.C.selectCardFirst); return; }
    var msg = 'Are you sure you want to delete this card: ' + (row.cardName||'') + '?';
    $.messager.confirm(adminUi.C.confirmDeletionTitle, msg, function(r){
        if(!r) return;
        $.ajax({url:'/api/v1/cards/'+row.id,type:'DELETE'}).done(function(){
            loadCards();
            adminUi.success(adminUi.C.cardDeleted);
        }).fail(function(xhr){
            var msg = xhr && xhr.responseText ? xhr.responseText : 'Unable to delete the card.';
            adminUi.fail(msg);
        });
    });
}

function reloadTree(){ $(tree).tree('reload'); }
</script>
</body>
</html>
