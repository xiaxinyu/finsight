<html>
<head>
    <title>== Category Rules ==</title>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.min.js"></script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.easyui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/bootstrap/easyui.css">
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/icon.css">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #f4f6f9;
            --panel-bg: #ffffff;
            --border-color: #e9ecef;
            --text-color: #333333;
            --header-bg: #f8f9fa;
            --hover-color: #e2e6ea;
            --selected-color: #e8f0fe;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            color: var(--text-color);
            background-color: var(--background-color);
        }

        /* Modernize EasyUI Panel & Layout */
        .panel-header, .panel-body { border-color: var(--border-color); }
        .panel-header { background: var(--header-bg); background-image: none; filter: none; }
        .panel-title { font-weight: 600; color: #495057; }

        /* Toolbar Styling */
        .rules-toolbar { 
            padding: 12px 15px; 
            border-bottom: 1px solid var(--border-color); 
            background-color: var(--panel-bg); 
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .rules-toolbar .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .rules-toolbar .row + .row { margin-top: 10px; }
        .rules-toolbar label { color: #555; font-size: 13px; font-weight: 500; }
        
        /* Input & Button Modernization */
        .easyui-linkbutton { border-radius: 4px; transition: all 0.2s; }
        .l-btn-plain:hover { background: var(--hover-color); border-radius: 4px; border: 1px solid transparent; }
        .textbox, .numberbox, .combobox, .datebox { border-radius: 4px; border-color: #ced4da; }
        
        /* Tree & Detail Panels */
        .tree-panel { background-color: #fcfcfc; border-right: 1px solid var(--border-color); }
        .detail-panel { background-color: var(--panel-bg); border-left: 1px solid var(--border-color); padding: 20px; }
        
        /* Detail Form Styling */
        .detail-item { margin-bottom: 15px; }
        .detail-item label { display: block; color: #495057; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
        .detail-header { 
            font-size: 16px; font-weight: 600; color: #343a40; 
            border-bottom: 2px solid var(--border-color); 
            padding-bottom: 10px; margin-bottom: 20px; 
        }

        /* Datagrid Refinements */
        .datagrid-header { background: var(--header-bg); border-bottom-color: var(--border-color); }
        .datagrid-header .datagrid-cell { font-weight: 600; color: #495057; font-size: 13px; padding: 8px 4px; }
        .datagrid-row-selected { background-color: var(--selected-color) !important; color: #212529 !important; }
        .datagrid-row-over { background-color: var(--hover-color); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="easyui-layout">
<div data-options="region:'north',border:false" style="height: 46px; padding:8px 15px; background:#fff; border-bottom:1px solid #e9ecef; display:flex; align-items:center;">
    <a class="easyui-linkbutton" data-options="iconCls:'icon-add',plain:true" onclick="addRule()">Add</a>
    <a class="easyui-linkbutton" data-options="iconCls:'icon-save',plain:true" onclick="saveRule()">Save</a>
    <a class="easyui-linkbutton" data-options="iconCls:'icon-remove',plain:true" onclick="deleteRule()">Delete</a>
    <span class="separator" style="border-left:1px solid #dee2e6; margin:0 10px; height:20px; display:inline-block;"></span>
    <a class="easyui-linkbutton" data-options="iconCls:'icon-reload',plain:true" onclick="reloadCache()">Reload Cache</a>
    <span class="separator" style="border-left:1px solid #dee2e6; margin:0 10px; height:20px; display:inline-block;"></span>
    <a class="easyui-linkbutton" data-options="iconCls:'icon-search',plain:true" onclick="openRegexTester()">Regex Test</a>
    <span id="hint" style="margin-left:15px; color:#868e96; font-style:italic; font-size:13px;">Select a category on the left</span>
</div>

<div data-options="region:'west',split:true,border:false" class="tree-panel" style="width: 200px; padding:10px;">
    <ul id="tree" class="easyui-tree" data-options="url:'/api/v1/consume/tree',method:'get',animate:true,lines:true"></ul>
</div>

<div data-options="region:'center',border:false" style="display:flex; flex-direction:column; overflow:hidden;">
    <div class="rules-toolbar" style="flex:0 0 auto;">
        <div class="row" style="justify-content: space-between;">
            <div>
                <input id="filterTag" class="easyui-textbox" style="width:200px; height:28px;" prompt="Filter by tag...">
                <a class="easyui-linkbutton" iconCls="icon-search" plain="true" onclick="loadRules()" style="height:28px;"></a>
            </div>
            <!-- Removed Bulk Set as requested -->
        </div>
    </div>
    <div style="flex:1; position:relative;">
        <table id="dg" fit="true" data-options="rownumbers:true,singleSelect:false,pagination:true,pageSize:50,fitColumns:true,scrollbarSize:14,checkOnSelect:true,selectOnCheck:true,striped:true,border:false,remoteSort:false">
        <thead>
        <tr>
            <th data-options="field:'ck',checkbox:true"></th>
            <th data-options="field:'id',width:160,hidden:true">ID</th>
            <th data-options="field:'pattern',width:200,halign:'center',formatter:fmt.pattern,editor:{type:'textbox'}">Pattern</th>
            <th data-options="field:'patternType',width:100,halign:'center',editor:{type:'combobox',options:{data:[{id:'contains',text:'contains'},{id:'regex',text:'regex'},{id:'equals',text:'equals'}],valueField:'id',textField:'text'}}">Type</th>
            <th data-options="field:'tags',width:300,halign:'center',formatter:fmt.tags,editor:{type:'tagbox',options:{hasDownArrow:true}}">Tags</th>
            <th data-options="field:'priority',width:120,halign:'center',align:'center',formatter:fmt.weight,editor:{type:'numberbox'}">Weight</th>
            <th data-options="field:'active',width:60,halign:'center',align:'center',formatter:fmt.active,editor:{type:'checkbox',options:{on:1,off:0}}">Active</th>
            <th data-options="field:'bankCode',width:100,hidden:true,editor:{type:'textbox'}">Bank</th>
            <th data-options="field:'cardTypeCode',width:120,hidden:true,editor:{type:'textbox'}">Card Type</th>
            <th data-options="field:'remark',width:180,halign:'center',editor:{type:'textbox'}">Remark</th>
        </tr>
        </thead>
    </table>
    </div>
</div>

<div data-options="region:'east',split:true,border:false" class="detail-panel" style="width: 300px;">
    <div class="detail-header">
        Rule Detail
    </div>
    
    <div class="detail-item">
        <label>Category</label>
        <input id="detail_category" class="easyui-textbox" style="width:100%;" readonly>
    </div>
    
    <div class="detail-item">
        <label>Pattern</label>
        <input id="detail_pattern" class="easyui-textbox" style="width:100%;">
    </div>
    
    <div style="display:flex; gap:10px;">
        <div class="detail-item" style="flex:1;">
            <label>Type</label>
            <input id="detail_type" class="easyui-combobox" style="width:100%;">
        </div>
        <div class="detail-item" style="flex:1;">
            <label>Weight</label>
            <input id="detail_weight" class="easyui-numberbox" data-options="min:0,precision:0" style="width:100%;">
        </div>
    </div>

    <div class="detail-item">
        <label>Active</label>
        <input id="detail_active" class="easyui-switchbutton" data-options="onText:'ON',offText:'OFF'" style="width:80px;">
    </div>

    <div class="detail-item">
        <label>Remark</label>
        <input id="detail_remark" class="easyui-textbox" style="width:100%;">
    </div>
    
    <div style="border-top:1px dashed #ddd; margin:15px 0;"></div>
    
    <div class="detail-item">
        <label>Bank</label>
        <input id="detail_bank" class="easyui-textbox" style="width:100%;">
    </div>
    <div class="detail-item">
        <label>Card Type</label>
        <input id="detail_card" class="easyui-textbox" style="width:100%;">
    </div>
    
    <div style="display:flex; gap:10px;">
        <div class="detail-item" style="flex:1;">
            <label>Min Amount</label>
            <input id="detail_min" class="easyui-numberbox" data-options="precision:2,min:0" style="width:100%;">
        </div>
        <div class="detail-item" style="flex:1;">
            <label>Max Amount</label>
            <input id="detail_max" class="easyui-numberbox" data-options="precision:2,min:0" style="width:100%;">
        </div>
    </div>
    
    <div style="display:flex; gap:10px;">
        <div class="detail-item" style="flex:1;">
            <label>Start Date</label>
            <input id="detail_start" class="easyui-datebox" style="width:100%;">
        </div>
        <div class="detail-item" style="flex:1;">
            <label>End Date</label>
            <input id="detail_end" class="easyui-datebox" style="width:100%;">
        </div>
    </div>

    <div style="margin-top:15px;">
        <a class="easyui-linkbutton" data-options="iconCls:'icon-save'" style="width:100%; height:32px;" onclick="saveDetail()">Save Detail</a>
    </div>
    
    <div style="margin-top:20px; font-weight:600; color:#555;">Recommendations</div>
    <div id="detail_recs" style="margin-top:6px; height:100px; overflow:auto; border:1px solid #eee; padding:6px; background:#fff; border-radius:3px;"></div>
    <div style="margin-top:8px;">
        <a class="easyui-linkbutton" data-options="iconCls:'icon-search',plain:true" onclick="loadRecommendations()">Refresh Recs</a>
    </div>
</div>

<script type="text/javascript">
var tree = '#tree';
var dg = '#dg';
var editIndex;
var selectedCategoryId = '';
var categoryMap = {};
var fmt = {
    categoryCode: function(v){ return categoryMap[v] || v; },
    tags: function(value){
        if (!value || value.length == 0) return '';
        return value.join(', ');
    },
    pattern: function(v,r){
        var t = (r.patternType||'contains').toLowerCase();
        var txt = $.trim(v||'');
        if(!txt) return '';
        if(t==='regex'){ return '<span style="font-weight:600;color:#0052d4;">'+escapeHtml(txt)+'</span>'; }
        if(t==='equals'){ return '<span style="font-weight:600;color:#333;">'+escapeHtml(txt)+'</span>'; }
        return '<span>'+escapeHtml(txt)+'</span>';
    },
    weight: function(v){
        var w = parseInt(v||0);
        var stars = Math.max(0, Math.min(5, Math.round(w/20)));
        var on = '★', off = '☆'; var s=''; for(var i=0;i<stars;i++){ s+=on; } for(var j=stars;j<5;j++){ s+=off; }
        var color = w>=90?'#0066ff':(w>=80?'#ff9800':'#999');
        return '<span style="color:'+color+';font-size:14px;letter-spacing:1px;">'+s+'</span> <span style="color:#888;">('+w+')</span>';
    },
    active: function(v){
        var on = parseInt(v||0)===1;
        return on ? '<span style="color:#10b981;">🟢</span>' : '<span style="color:#ef4444;">🔴</span>';
    }
};

function escapeHtml(str){
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/\'/g,'&#39;');
}

$(function(){
    $(tree).tree({
        url:'/api/v1/consume/tree',
        method:'get',
        onLoadSuccess:function(){ $(tree).tree('collapseAll'); },
        onSelect:function(node){
            selectedCategoryId = node.id;
            loadRules();
        }
    });
    $(dg).datagrid({
        method:'get',
        url:'/api/v1/consume/rules',
        queryParams:{categoryId:''},
        loadFilter:pagerFilter,
        pageSize:50,
        pageList:[20,50,100,200],
        rowStyler:function(index,row){
            var w = parseInt(row.priority||0);
            var a = parseInt(row.active||0);
            if(a!==1) return 'color:#999;text-decoration:line-through;background:#f9f9f9;';
            if(w>=90) return 'background:#f0f7ff;';
            if(w>=80) return 'background:#fff7e6;';
            return '';
        },
        onClickRow:function(index,row){ renderDetail(row); }
    });
    $.get('/api/v1/consume/categories', function(res){
        var rows = (res && res.rows) ? res.rows : [];
        for(var i=0;i<rows.length;i++){ categoryMap[rows[i].id] = rows[i].code; }
    });
    try{
        $('#detail_type').combobox({editable:false,valueField:'id',textField:'text',data:[{id:'contains',text:'contains'},{id:'regex',text:'regex'},{id:'equals',text:'equals'}]});
        $('#detail_active').switchbutton();
    }catch(e){}
});

function loadRules(stayOnPage){
    var grid = $(dg);
    // Clear previous allRows cache to ensure fresh data is loaded
    var state = grid.data('datagrid');
    if(state && state.allRows) state.allRows = null;

    var tagVal = $('#filterTag').textbox('getValue');
    var param = {categoryId:selectedCategoryId, tag:tagVal};
    
    if(stayOnPage){
        grid.datagrid('reload', param);
    } else {
        grid.datagrid('load', param);
    }
    loadRecommendations();
}

function endEditing(){
    if (editIndex == undefined){return true}
    if ($(dg).datagrid('validateRow', editIndex)){
        $(dg).datagrid('endEdit', editIndex);
        editIndex = undefined;
        return true;
    } else {return false}
}

function addRule(){
    if (!selectedCategoryId) {
        $.messager.alert('Tip', 'Please select a category on the left first');
        return;
    }
    if (endEditing()){
        $(dg).datagrid('appendRow',{categoryId:selectedCategoryId,priority:100,active:1,patternType:'contains',tags:[]});
        editIndex = $(dg).datagrid('getRows').length-1;
        $(dg).datagrid('selectRow', editIndex).datagrid('beginEdit', editIndex);
    }
}

function saveRule(){
    if (!endEditing()) return;
    var row = $(dg).datagrid('getSelected');
    if (!row) return;
    row.categoryId = selectedCategoryId || row.categoryId;
    var dup = hasConflict(row);
    if(dup){
        $.messager.confirm('冲突警告','检测到可能的规则重复或冲突，仍然保存？',function(ok){
            if(!ok) return;
            doSaveRow(row);
        });
        return;
    }
    doSaveRow(row);
}

function doSaveRow(row){
    // Prioritize grid edits (in row) over detail form values (in readDetail) for grid columns
    var form = readDetail();
    var merged = $.extend({}, row, form);
    var gridFields = ['pattern', 'patternType', 'priority', 'active', 'remark'];
    for(var i=0; i<gridFields.length; i++){
        var f = gridFields[i];
        if(row[f] !== undefined) merged[f] = row[f];
    }

    var method = row.id ? 'PUT' : 'POST';
    var url = '/api/v1/consume/rules' + (row.id ? '/' + row.id : '');
    $.ajax({url:url,type:method,contentType:'application/json',data:JSON.stringify(merged)}).done(function(){
        loadRules(true);
    });
}

function deleteRule(){
    var row = $(dg).datagrid('getSelected');
    if (!row || !row.id) return;
    var msg = 'Confirm deleting keyword '+(row.pattern||'')+'?';
    $.messager.confirm('Confirm', msg, function(r){
        if(!r) return;
        $.ajax({url:'/api/v1/consume/rules/'+row.id,type:'DELETE'}).done(function(){
            loadRules();
            $.messager.show({title:'OK',msg:'Deleted successfully'});
        }).fail(function(xhr){ $.messager.alert('Error', xhr.responseText || 'Error'); });
    });
}

function reloadCache(){
    $.post('/api/v1/consume/rules/reload').done(function(){
        $.messager.show({title:'OK',msg:'Rules cache reloaded'});
    });
}

function reloadTree(){ $(tree).tree('reload'); }

function pagerFilter(data){
    if ($.isArray(data)){
        data = {
            total: data.length,
            rows: data
        }
    }
    var target = this;
    var dg = $(target);
    var state = dg.data('datagrid');
    var opts = dg.datagrid('options');
    if (!state.allRows){
        state.allRows = (data.rows || []);
    }
    if (!opts.remoteSort && opts.sortName){
        var names = opts.sortName.split(',');
        var orders = opts.sortOrder.split(',');
        state.allRows.sort(function(r1,r2){
            var r = 0;
            for(var i=0; i<names.length; i++){
                var sn = names[i];
                var so = orders[i];
                var col = dg.datagrid('getColumnOption', sn);
                var sortFunc = col.sorter || function(a,b){
                    return a==b ? 0 : (a>b?1:-1);
                };
                r = sortFunc(r1[sn], r2[sn]) * (so=='asc'?1:-1);
                if (r != 0){
                    return r;
                }
            }
            return r;
        });
    }
    var start = (opts.pageNumber-1)*parseInt(opts.pageSize);
    var end = start + parseInt(opts.pageSize);
    data.rows = state.allRows.slice(start, end);
    return data;
}





function hasConflict(row){
    var grid = $(dg);
    var state = grid.data('datagrid');
    var list = (state && state.allRows) ? state.allRows : (grid.datagrid('getRows')||[]);

    var pat = $.trim(row.pattern||'');
    var type = $.trim(row.patternType||'contains').toLowerCase();
    var cat = $.trim(row.categoryId||'');
    if(!pat || !cat) return false;
    for(var i=0;i<list.length;i++){
        var r = list[i]||{};
        var sameCat = $.trim(r.categoryId||'')===cat;
        var sameType = $.trim((r.patternType||'contains')).toLowerCase()===type;
        var samePat = $.trim(r.pattern||'')===pat;
        var sameId = $.trim(r.id||'')===$.trim(row.id||'');
        if(!sameId && sameCat && sameType && samePat && parseInt(r.active||0)===1) return true;
        if(!sameId && sameCat && type==='contains' && ($.trim(r.patternType||'').toLowerCase()==='equals') && $.trim(r.pattern||'')===pat) return true;
    }
    return false;
}

function getSelections(){ return $(dg).datagrid('getSelections')||[]; }

function batchEnable(){
    var rows = getSelections(); if(rows.length===0){ $.messager.alert('Tip','请选择规则'); return; }
    var done=0; for(var i=0;i<rows.length;i++){ var r=rows[i]; r.active=1; $.ajax({url:'/api/v1/consume/rules/'+r.id,type:'PUT',contentType:'application/json',data:JSON.stringify(r)}).always(function(){done++; if(done===rows.length){ loadRules(true); }}); }
}
function batchDisable(){
    var rows = getSelections(); if(rows.length===0){ $.messager.alert('Tip','请选择规则'); return; }
    var done=0; for(var i=0;i<rows.length;i++){ var r=rows[i]; r.active=0; $.ajax({url:'/api/v1/consume/rules/'+r.id,type:'PUT',contentType:'application/json',data:JSON.stringify(r)}).always(function(){done++; if(done===rows.length){ loadRules(true); }}); }
}
function batchCopy(){
    var rows = getSelections(); if(rows.length===0){ $.messager.alert('Tip','请选择规则'); return; }
    var done=0; for(var i=0;i<rows.length;i++){ var r=rows[i]; var cp=$.extend({},r); delete cp.id; cp.priority=parseInt(r.priority||0); $.ajax({url:'/api/v1/consume/rules',type:'POST',contentType:'application/json',data:JSON.stringify(cp)}).always(function(){done++; if(done===rows.length){ loadRules(); }}); }
}
function batchDelete(){
    var rows = getSelections(); if(rows.length===0){ $.messager.alert('Tip','请选择规则'); return; }
    $.messager.confirm('Confirm','确认删除选中的规则？',function(ok){
        if(!ok) return;
        var done=0; for(var i=0;i<rows.length;i++){ var r=rows[i]; $.ajax({url:'/api/v1/consume/rules/'+r.id,type:'DELETE'}).always(function(){done++; if(done===rows.length){ loadRules(); }}); }
    });
}

function openRegexTester(){
    var row = $(dg).datagrid('getSelected')||{};
    var pat = $.trim(row.pattern||'');
    var type = $.trim(row.patternType||'contains').toLowerCase();
    var html = '<div id="regexTesterDlg" style="padding:12px;width:460px;">'+
        '<div style="margin-bottom:10px;"><label style="display:inline-block;width:120px;">Pattern</label><input id="rt_pattern" class="easyui-textbox" style="width:300px;" value="'+escapeHtml(pat)+'"></div>'+
        '<div style="margin-bottom:10px;"><label style="display:inline-block;width:120px;">Type</label><input id="rt_type" class="easyui-combobox" style="width:160px;"></div>'+
        '<div style="margin-bottom:10px;"><label style="display:inline-block;width:120px;">Test Text</label><input id="rt_text" class="easyui-textbox" style="width:300px;"></div>'+
        '<div><a class="easyui-linkbutton" onclick="rt_run()">Test</a> <span id="rt_result" style="margin-left:12px;color:#333;"></span></div>'+
        '</div>';
    var dlg = $(html).appendTo('body');
    try{
        $('#rt_type').combobox({editable:false,valueField:'id',textField:'text',data:[{id:'contains',text:'contains'},{id:'regex',text:'regex'},{id:'equals',text:'equals'}], onLoadSuccess:function(){ try{$('#rt_type').combobox('setValue', type);}catch(e){} }});
    }catch(e){}
    $(dlg).dialog({title:'正则测试', modal:true, width:520, height:220, onClose:function(){ try{$(dlg).dialog('destroy'); $(dlg).remove();}catch(e){} }});
}
function rt_run(){
    var pat = $.trim($('#rt_pattern').textbox('getValue')||'');
    var type = $.trim($('#rt_type').combobox('getValue')||'contains').toLowerCase();
    var text = $.trim($('#rt_text').textbox('getValue')||'');
    var ok = false;
    if(type==='equals'){ ok = text===pat; }
    else if(type==='regex'){ try{ ok = new RegExp(pat).test(text); }catch(e){ ok=false; } }
    else { ok = text.indexOf(pat)>=0; }
    $('#rt_result').text(ok ? '✅ Match' : '❌ Not match');
}

function fmtDateValue(d){
    if(!d) return '';
    if(d instanceof Date){
        var y=d.getFullYear(); var m=('0'+(d.getMonth()+1)).slice(-2); var day=('0'+d.getDate()).slice(-2);
        return y+'-'+m+'-'+day;
    }
    var s = String(d);
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m){ return m[1]+'-'+m[2]+'-'+m[3]; }
    return '';
}
function renderDetail(row){
    $('#detail_category').textbox('setValue', categoryMap[row.categoryId] || row.categoryId || '');
    $('#detail_pattern').textbox('setValue', row.pattern || '');
    $('#detail_type').combobox('setValue', (row.patternType||'contains'));
    $('#detail_weight').numberbox('setValue', parseInt(row.priority||0));
    try{ $('#detail_active').switchbutton(row.active===1?'check':'uncheck'); }catch(e){}
    $('#detail_bank').textbox('setValue', row.bankCode || '');
    $('#detail_card').textbox('setValue', row.cardTypeCode || '');
    $('#detail_min').numberbox('setValue', row.minAmount || null);
    $('#detail_max').numberbox('setValue', row.maxAmount || null);
    try{ $('#detail_start').datebox('setValue', fmtDateValue(row.startDate)); }catch(e){ $('#detail_start').datebox('setValue',''); }
    try{ $('#detail_end').datebox('setValue', fmtDateValue(row.endDate)); }catch(e){ $('#detail_end').datebox('setValue',''); }
    $('#detail_remark').textbox('setValue', row.remark || '');
}
function readDetail(){
    var activeOn = false;
    try{ activeOn = $('#detail_active').switchbutton('options').checked; }catch(e){}
    var data = {
        pattern: $('#detail_pattern').textbox('getValue'),
        patternType: $('#detail_type').combobox('getValue'),
        priority: parseInt($('#detail_weight').numberbox('getValue')||'0'),
        active: activeOn?1:0,
        bankCode: $('#detail_bank').textbox('getValue'),
        cardTypeCode: $('#detail_card').textbox('getValue'),
        minAmount: (function(){ var v=$('#detail_min').numberbox('getValue'); return v?Number(v):null; })(),
        maxAmount: (function(){ var v=$('#detail_max').numberbox('getValue'); return v?Number(v):null; })(),
        startDate: (function(){ return $('#detail_start').datebox('getValue'); })(),
        endDate: (function(){ return $('#detail_end').datebox('getValue'); })(),
        remark: $('#detail_remark').textbox('getValue')
    };
    if(selectedCategoryId){ data.categoryId = selectedCategoryId; }
    return data;
}
function saveDetail(){
    var row = $(dg).datagrid('getSelected');
    if(!row) return;
    var payload = $.extend({}, row, readDetail());
    var method = row.id ? 'PUT' : 'POST';
    var url = '/api/v1/consume/rules' + (row.id ? '/' + row.id : '');
    $.ajax({url:url,type:method,contentType:'application/json',data:JSON.stringify(payload)}).done(function(){
        loadRules();
    });
}
function loadRecommendations(){
    if(!selectedCategoryId){ $('#detail_recs').html(''); return; }
    var $box = $('#detail_recs');
    $box.html('<span style="color:#999;">Loading...</span>');
    $.get('/api/v1/consume/rules/recommend', {categoryId:selectedCategoryId}, function(arr){
        var list = $.isArray(arr)?arr:[];
        if(!list.length){
            $.get('/api/v1/consume/rules/suggest', {categoryId:selectedCategoryId}, function(arr2){
                renderRecs($.isArray(arr2)?arr2:[]);
            });
            return;
        }
        renderRecs(list);
    }).fail(function(){
        $.get('/api/v1/consume/rules/suggest', {categoryId:selectedCategoryId}, function(arr2){
            renderRecs($.isArray(arr2)?arr2:[]);
        });
    });
}
function renderRecs(list){
    var html = '';
    for(var i=0;i<Math.min(20, list.length);i++){
        var t = list[i]||'';
        html += '<div style="padding:6px 8px;border:1px solid #eee;border-radius:4px;margin-bottom:6px;cursor:pointer;" onclick="applyRec(\''+String(t).replace(/'/g,'&#39;')+'\')">'+String(t)+'</div>';
    }
    if(!html) html = '<div style="color:#999;">No recommendations</div>';
    $('#detail_recs').html(html);
}
function applyRec(t){
    var v = $('#detail_pattern').textbox('getValue');
    if(!v){ $('#detail_pattern').textbox('setValue', t); return; }
    var merged = v + '|' + t;
    $('#detail_pattern').textbox('setValue', merged);
}
</script>
</body>
</html>
