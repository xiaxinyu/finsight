<div id="navigationDiv" class="easyui-tabs" data-options="tools:'#tab-tools',fit:true,border:false">
     <div  data-options="title:'Home'">
      	<iframe id="frameIndex" name="frameIndex" frameborder="0" scrolling="auto" src="/account/index.html" width="100%" height="100%"></iframe>
    </div> 
</div>
<div id="tab-tools">
    <a href="javascript:void(0)" class="easyui-linkbutton" data-options="plain:true,iconCls:'icon-remove'" onclick="removePanel()"></a>
</div> 
<script type="text/javascript">
	var navigationDiv = "#navigationDiv";
    /** Keep sidebar highlight in sync when user switches tabs from the tab bar (not only from the menu). */
    function syncMenuWithTabTitle(title){
        try{
            if(!title || title === 'Home'){ return; }
            var matched = null;
            $('.menu-link').each(function(){
                if($(this).attr('title') === title){
                    matched = $(this);
                    return false;
                }
            });
            if(matched && matched.length){
                $('.menu-link').removeClass('menu-link-active');
                matched.addClass('menu-link-active');
                localStorage.setItem('fs.menu.active.title', title);
            }
        }catch(e){}
    }
    /** 初始化页面 */
    function initPanel(title,url){
    	var tab = $(navigationDiv).tabs('getTab',title);  
    	if(tab != undefined && tab != null){
    		$(navigationDiv).tabs('select',title);
    	}else{
    		addPanel(title,url);
    	}
    }
    /** 添加面板 */
    function addPanel(title,url){
        var fullUrl = "/" + url;
    	var iframe = '<iframe scrolling="auto" id="frame" name="frame" src="' + fullUrl + '" width="100%" height="100%" frameborder="0" onload="try{var w=this.contentWindow;var p=w.location.pathname;if(p===\'/login.html\'|| w.document.getElementById(\'login-form\')){window.top.location.href=\'/login.html\';}}catch(e){}"></iframe>';
    	var tab = {
            title: title,
            content:iframe,
            closable: true
        };
        $(navigationDiv).tabs('add',tab);
    }
    /** 刷新面板数据 */
    function refresh(){
    	var tab = $(navigationDiv).tabs('getSelected');    
    	var panel = tab.panel('panel');
		var frame = panel.find('iframe');
		try {
			if (frame.length > 0) {
				for ( var i = 0; i < frame.length; i++) {
					frame[i].contentWindow.document.write('');
					frame[i].contentWindow.close();
					frame[i].src = frame[i].src;
				}
                var isIE = !!window.document.documentMode;
                if (isIE && window.CollectGarbage) {
                    CollectGarbage();
                }
            }
        } catch (e) {
		}
    }
    $(function(){
        try{
            $(navigationDiv).tabs({
                onSelect: function(title){ syncMenuWithTabTitle(title); }
            });
            var sel = $(navigationDiv).tabs('getSelected');
            if(sel && sel.length){
                var t = sel.panel('options').title;
                syncMenuWithTabTitle(t);
            }
        }catch(e){}
    });
    /** 关闭页面 */
    function removePanel(){
        var tab = $(navigationDiv).tabs('getSelected');
        if($(tab).panel('options').title != 'Home'){
        	if (tab){
                var index = $(navigationDiv).tabs('getTabIndex', tab);
                $(navigationDiv).tabs('close', index);
            }
        }
    }
</script>
