<div class="fs-header" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <style>
        .fs-header{
            height: 64px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .fs-brand{
            display:flex;
            align-items:center;
            gap:10px;
            min-width: 260px;
        }
        .fs-logo{
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #1890ff;
            box-shadow: 0 6px 14px rgba(24,144,255,0.25);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-weight:800;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .fs-brand-text{
            display:flex;
            flex-direction:column;
            line-height: 1.1;
        }
        .fs-title{
            font-size: 16px;
            font-weight: 800;
            color: #111827;
        }
        .fs-subtitle{
            font-size: 12px;
            color: #6b7280;
            white-space: nowrap;
        }
        .fs-user{
            display:flex;
            align-items:center;
            gap:10px;
            color:#374151;
            font-size: 13px;
        }
        .fs-left{
            display:flex;
            align-items:center;
            gap:12px;
        }
        .fs-toggle{
            width: 34px;
            height: 34px;
            border: 1px solid rgba(0,0,0,0.08);
            background: #fff;
            border-radius: 8px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor: pointer;
            color:#374151;
        }
        .fs-toggle:hover{
            background: rgba(0,0,0,0.04);
        }
        .fs-user-name{
            font-weight: 700;
            color: #111827;
        }
        .fs-divider{
            width: 1px;
            height: 14px;
            background: #e5e7eb;
        }
        .fs-logout{
            color: #ef4444;
            text-decoration:none;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .fs-logout:hover{
            background: rgba(239,68,68,0.08);
            color: #dc2626;
        }
    </style>

    <div class="fs-left">
        <button class="fs-toggle" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
        <div class="fs-brand">
            <div class="fs-logo">F</div>
            <div class="fs-brand-text">
                <div class="fs-title">FinSight</div>
                <div class="fs-subtitle">Understand your money. Understand yourself.</div>
            </div>
        </div>
    </div>

    <div class="fs-user">
        <div>Hi, <span class="fs-user-name" sec:authentication="name">User</span></div>
        <div class="fs-divider"></div>
        <a href="/logout" class="fs-logout" title="Sign out">Logout</a>
    </div>
</div>
<script type="text/javascript">
    function toggleSidebar(){
        try{
            var $layout = $('#fs-main');
            var p = $layout.layout('panel','west');
            if(p && p.length){
                var opts = p.panel('options') || {};
                if(opts.collapsed){
                    $layout.layout('expand','west');
                }else{
                    $layout.layout('collapse','west');
                }
            }
        }catch(e){}
    }
</script>
