<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>FinSight | Login</title>
    <meta name="description" content="particles.js is a lightweight JavaScript library for creating particles.">
    <meta name="author" content="Vincent Garreau"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" media="screen" href="plugins/login/css/style.css">
    <link rel="stylesheet" type="text/css" href="plugins/login/css/reset.css"/>
</head>
<body>

<div id="particles-js">
    <div class="login">
        <div class="login-top">
            <div class="brand">
                <div class="brand-title">FinSight</div>
                <div class="brand-subtitle">Understand your money. Understand yourself.</div>
            </div>
        </div>
        <div id="error-tip" class="error-tip" role="alert" aria-live="polite"></div>
        <form id="login-form" class="form-signin" method="post" action="/authentication/form">
            <div class="login-center clearfix">
                <div class="login-center-img"><img src="plugins/login/img/name.png"/></div>
                <div class="login-center-input">
                    <input type="text" id="username" name="username" value="" placeholder="Please enter your username" onfocus="this.placeholder=''"
                           onblur="this.placeholder='Please enter your username'"/>
                </div>
            </div>
            <div class="login-center clearfix">
                <div class="login-center-img"><img src="plugins/login/img/password.png"/></div>
                <div class="login-center-input">
                    <input type="password" id="password" name="password" value="" placeholder="Please enter your password" onfocus="this.placeholder=''"
                           onblur="this.placeholder='Please enter your password'"/>
                    <span id="togglePwd" class="toggle-password" onclick="togglePassword()">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.25 12c1.5-4.5 5.25-7.5 9.75-7.5s8.25 3 9.75 7.5c-1.5 4.5-5.25 7.5-9.75 7.5S3.75 16.5 2.25 12z"></path>
                            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </span>
                </div>
            </div>
        </form>
        <div class="login-button" onclick="submitForm()">
            Sign In
        </div>
    </div>
    <div class="sk-rotating-plane"></div>
</div>

<!-- scripts -->
<script src="plugins/login/js/particles.min.js"></script>
<script src="plugins/login/js/app.js"></script>
<script type="text/javascript">
	function hasClass(elem, cls) {
	  cls = cls || '';
	  if (cls.replace(/\s/g, '').length == 0) return false; //当cls没有参数时，返回false
	  return new RegExp(' ' + cls + ' ').test(' ' + elem.className + ' ');
	}

	function addClass(ele, cls) {
	  if (!hasClass(ele, cls)) {
	    ele.className = ele.className == '' ? cls : ele.className + ' ' + cls;
	  }
	}

	function removeClass(ele, cls) {
	  if (hasClass(ele, cls)) {
	    var newClass = ' ' + ele.className.replace(/[\t\r\n]/g, '') + ' ';
	    while (newClass.indexOf(' ' + cls + ' ') >= 0) {
	      newClass = newClass.replace(' ' + cls + ' ', ' ');
	    }
	    ele.className = newClass.replace(/^\s+|\s+$/g, '');
	  }
	}

    function submitForm(){
        document.getElementById("login-form").submit()
    }

    function togglePassword(){
        var p = document.getElementById('password');
        var t = document.getElementById('togglePwd');
        var eye = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2.25 12c1.5-4.5 5.25-7.5 9.75-7.5s8.25 3 9.75 7.5c-1.5 4.5-5.25 7.5-9.75 7.5S3.75 16.5 2.25 12z\"></path><path d=\"M15 12a3 3 0 11-6 0 3 3 0 016 0z\"></path></svg>';
        var eyeOff = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2.25 12c1.5-4.5 5.25-7.5 9.75-7.5 2.053 0 3.99.5 5.707 1.36\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"></path><path d=\"M21.75 12c-1.5 4.5-5.25 7.5-9.75 7.5-2.053 0-3.99-.5-5.707-1.36\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"></path><path d=\"M9 9a3 3 0 104.5 4.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"></path><path d=\"M3 3l18 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"></path></svg>';
        if (p.type === 'password') {
            p.type = 'text';
            t.innerHTML = eyeOff;
        } else {
            p.type = 'password';
            t.innerHTML = eye;
        }
    }

    (function(){
        fetch('/login-error.json', { credentials: 'same-origin' })
            .then(function(r){ return r.json(); })
            .then(function(d){
                if (d && d.msg && String(d.msg).trim().length > 0) {
                    var tip = document.getElementById('error-tip');
                    tip.textContent = d.msg;
                    tip.classList.add('visible');
                }
            })
            .catch(function(){});
    })();

</script>
</body>
</html>
