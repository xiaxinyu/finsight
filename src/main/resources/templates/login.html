<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>FinSight · Sign in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1f3a">
    <meta name="description" content="FinSight — personal finance intelligence, local-first.">
    <link rel="stylesheet" type="text/css" href="plugins/login/css/reset.css"/>
    <link rel="stylesheet" media="screen" href="plugins/login/css/style.css">
</head>
<body>

<div id="particles-js" class="login-page">
    <div class="login-page__bg" aria-hidden="true"></div>
    <main class="login-card">
        <header class="login-card__header">
            <div class="login-card__brand">
                <div class="login-card__logo" aria-hidden="true">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <rect width="40" height="40" rx="12" fill="url(#loginLogoGrad)"/>
                        <path d="M9 27l6.5-9 4.8 3.8L31 11" stroke="white" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".95"/>
                        <circle cx="31" cy="11" r="2.25" fill="white" opacity=".95"/>
                        <circle cx="9" cy="27" r="2" fill="white" opacity=".85"/>
                        <defs>
                            <linearGradient id="loginLogoGrad" x1="6" y1="4" x2="36" y2="38" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3b82f6"/>
                                <stop offset="1" stop-color="#1d4ed8"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="login-card__titles">
                    <h1 class="login-card__title">FinSight</h1>
                    <p class="login-card__subtitle">Understand your money. Understand yourself.</p>
                </div>
            </div>
        </header>

        <div id="error-tip" class="login-error" role="alert" aria-live="polite"></div>

        <form id="login-form" class="login-form" method="post" action="/authentication/form" autocomplete="on">
            <div class="login-field">
                <label class="login-field__label" for="username">Username</label>
                <div class="login-field__wrap">
                    <span class="login-field__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input type="text" id="username" name="username" class="login-field__input"
                           autocomplete="username" placeholder=" " required
                           inputmode="text"/>
                </div>
            </div>
            <div class="login-field">
                <label class="login-field__label" for="password">Password</label>
                <div class="login-field__wrap">
                    <span class="login-field__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                    </span>
                    <input type="password" id="password" name="password" class="login-field__input login-field__input--pwd"
                           autocomplete="current-password" placeholder=" " required/>
                    <button type="button" id="togglePwd" class="login-field__toggle" onclick="togglePassword()" aria-label="Show or hide password">
                        <span class="login-field__toggle-icon login-field__toggle-icon--show" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M2.25 12c1.5-4.5 5.25-7.5 9.75-7.5 2.053 0 3.99.5 5.707 1.36" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M21.75 12c-1.5 4.5-5.25 7.5-9.75 7.5-2.053 0-3.99-.5-5.707-1.36" fill="none" stroke="currentColor" stroke-width="1.75"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.75"/></svg>
                        </span>
                        <span class="login-field__toggle-icon login-field__toggle-icon--hide" aria-hidden="true" hidden>
                            <svg viewBox="0 0 24 24"><path d="M2.25 12c1.5-4.5 5.25-7.5 9.75-7.5 2.053 0 3.99.5 5.707 1.36" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M21.75 12c-1.5 4.5-5.25 7.5-9.75 7.5-2.053 0-3.99-.5-5.707-1.36" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M9 9a3 3 0 1 0 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.75"/></svg>
                        </span>
                    </button>
                </div>
            </div>
            <button type="submit" class="login-submit">
                <span>Sign in</span>
                <svg class="login-submit__arrow" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M11.3 4.7a1 1 0 0 1 1.4 0l5 5a1 1 0 0 1 0 1.4l-5 5a1 1 0 0 1-1.4-1.4L14.6 12H4a1 1 0 1 1 0-2h10.6l-3.3-3.3a1 1 0 0 1 0-1.4z"/></svg>
            </button>
        </form>

        <footer class="login-card__footer">
            <p class="login-card__meta">Local-first · Self-hosted · Your data stays on your infrastructure</p>
        </footer>
    </main>
</div>

<script src="plugins/login/js/particles.min.js"></script>
<script src="plugins/login/js/app.js"></script>
<script type="text/javascript">
    function togglePassword(){
        var p = document.getElementById('password');
        var showIcon = document.querySelector('.login-field__toggle-icon--show');
        var hideIcon = document.querySelector('.login-field__toggle-icon--hide');
        if (p.type === 'password') {
            p.type = 'text';
            if (showIcon) showIcon.hidden = true;
            if (hideIcon) hideIcon.hidden = false;
        } else {
            p.type = 'password';
            if (showIcon) showIcon.hidden = false;
            if (hideIcon) hideIcon.hidden = true;
        }
    }

    (function(){
        fetch('/login-error.json', { credentials: 'same-origin' })
            .then(function(r){ return r.json(); })
            .then(function(d){
                if (d && d.msg && String(d.msg).trim().length > 0) {
                    var tip = document.getElementById('error-tip');
                    tip.textContent = d.msg;
                    tip.classList.add('login-error--visible');
                }
            })
            .catch(function(){});
    })();
</script>
</body>
</html>
