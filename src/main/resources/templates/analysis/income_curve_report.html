<script type="text/javascript">
function initIncomeCurveYears(){
    try{
        var curY = new Date().getFullYear();
        var m = /[?&]year=(\d{4})/.exec(window.location.search||'');
        if(m && m[1]){ curY = parseInt(m[1], 10) || curY; }
        var startY = curY - 15;
        var years = [];
        for(var y = curY; y >= startY; y--){
            years.push({ value: ''+y, text: ''+y });
        }
        $('#cmbYear').combobox('loadData', years);
        $('#cmbYear').combobox('setValue', ''+curY);
    }catch(e){}
}

$(function(){
    var initialized = false;
    $.parser.onComplete = function(){
        if(initialized) return;
        initialized = true;
        initIncomeCurveYears();
        // Default comparison: current year
        try{ $('#chkYoY').prop('checked', true); }catch(e){}
        applyFocusHint();
        scheduleStatistic();
    };
});

// Fallback for cases where parser timing skips onComplete.
$(function(){
    initIncomeCurveYears();
    setTimeout(initIncomeCurveYears, 80);
    setTimeout(function(){
        try{
            var y = safeComboboxValue('#cmbYear');
            if(!/^\d{4}$/.test(y)){ initIncomeCurveYears(); }
        }catch(e){}
    }, 300);
});

function applyFocusHint(){
    try{
        if(window.reportFocus && reportFocus.applyToPage){
            reportFocus.applyToPage({
                afterSelector: '.filter-bar',
                cmbConsumeSelector: '#cmbConsume',
                onFilterApplied: function(ctx){ try{ if(!ctx || ctx.changed){ scheduleStatistic(); } }catch(e){} }
            });
        }
    }catch(e){}
}

function toggleYoY(){
    scheduleStatistic();
}

function safeComboboxValue(sel){ var jq=$(sel); try{ var v=jq.combobox('getValue'); if(v!=null) return $.trim(v);}catch(e){} var v2=jq.val(); return v2?$.trim(v2):''; }
function safeTextboxValue(sel){ var jq=$(sel); try{ return $.trim(jq.textbox('getValue')); }catch(e){ return $.trim(jq.val()||''); } }
function safeCombotreeValues(sel){ var jq=$(sel); try{ var arr=jq.combotree('getValues'); if(arr&&arr.length) return $.trim(arr.join(',')); }catch(e){} var v2=jq.val(); return v2?$.trim(v2):''; }
function expandedConsumeValues(sel){
    var jq = $(sel);
    var raw = [];
    try{ raw = jq.combotree('getValues') || []; }catch(e){}
    if(!raw || !raw.length){ return ''; }
    var tree = null;
    try{ tree = jq.combotree('tree'); }catch(e){}
    if(!tree){ return $.trim(raw.join(',')); }
    var ids = [];
    var seen = {};
    function pushId(id){
        var v = String(id || '').trim();
        if(!v || seen[v]){ return; }
        seen[v] = true;
        ids.push(v);
    }
    function walk(node){
        if(!node){ return; }
        var children = node.children || [];
        if(children.length === 0){
            pushId(node.id || node.code || node.value);
            return;
        }
        // Parent selected: expand to all leaf codes for accurate report filtering.
        for(var i=0;i<children.length;i++){ walk(children[i]); }
    }
    for(var i=0;i<raw.length;i++){
        var rid = raw[i];
        var nd = null;
        try{ nd = tree.tree('find', rid); }catch(e){}
        if(nd){ walk(nd); } else { pushId(rid); }
    }
    return $.trim(ids.join(','));
}
function moneyText(v){
    var n = Number(v || 0);
    if(isNaN(n)){ n = 0; }
    return '¥' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function pctText(v){
    var n = Number(v);
    if(!isFinite(n)){ return '--'; }
    return (n * 100).toFixed(1) + '%';
}

function isSuccessResult(res){
    try{ return !!(res && app.api && app.api.normalizeResult && app.api.normalizeResult(res).ok); }catch(e){}
    return !!(res && (res.returnCode === 'success' || res.code === 20000 || res.code === 200));
}

function getResultData(res){
    try{
        if(res && app.api && app.api.normalizeResult){
            return app.api.normalizeResult(res).data;
        }
    }catch(e){}
    return res ? res.returnMessage : null;
}

function scheduleStatistic(){
    if(window.__incomeCurveStatTimer){ clearTimeout(window.__incomeCurveStatTimer); }
    window.__incomeCurveStatTimer = setTimeout(function(){
        window.__incomeCurveStatTimer = null;
        statistic();
    }, 300);
}

function getParamsBase(){
    var year = safeComboboxValue('#cmbYear');
    var cardtype = safeComboboxValue('#cmbCardTypes'); if(cardtype==='0') cardtype='';
    var demoArea = safeTextboxValue('#txtDemo');
    var consume = expandedConsumeValues('#cmbConsume');
    return {'year':year,'cardTypeName':cardtype,'demoArea':demoArea,'consumeID':consume};
}

function monthCodeList(){ return ['01','02','03','04','05','06','07','08','09','10','11','12']; }
function monthNameList(){ return ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月']; }
function getMonthCodeByName(en){
    var map = {
        'Janunary':'01','January':'01','一月':'01',
        'February':'02','二月':'02',
        'March':'03','三月':'03',
        'April':'04','四月':'04',
        'May':'05','五月':'05',
        'June':'06','六月':'06',
        'July':'07','七月':'07',
        'August':'08','八月':'08',
        'September':'09','九月':'09',
        'October':'10','十月':'10',
        'November':'11','十一月':'11',
        'December':'12','十二月':'12'
    };
    return map[en]||'';
}

function statistic(){
    var base = getParamsBase();
    var y1 = parseInt(base.year, 10);
    if(isNaN(y1)){ return; }

    var y2 = ($('#chkYoY').prop('checked') ? (y1 - 1).toString() : '');

    var pIncomeA = $.extend({}, base, {'txnTypes':'income'});
    transaction.monthIncomeReport(pIncomeA, function(diA){
        var arrIA = [];
        try{ if(isSuccessResult(diA)){ arrIA = $.parseJSON(getResultData(diA)||'[]')||[]; } }catch(e){}

        if(y2){
            var baseB = $.extend({}, base, {'year': y2});
            var pIncomeB = $.extend({}, baseB, {'txnTypes':'income'});
            transaction.monthIncomeReport(pIncomeB, function(diB){
                var arrIB = [];
                try{ if(isSuccessResult(diB)){ arrIB = $.parseJSON(getResultData(diB)||'[]')||[]; } }catch(e){}
                renderIncomeTrend(arrIA, arrIB, y1, y2);
            }, function(){ renderIncomeTrend(arrIA, null, y1, y2); });
        }else{
            renderIncomeTrend(arrIA, null, y1, '');
        }
    }, function(){ app.messager.error('Income request failed.'); });
}

function renderIncomeTrend(arrIncomeA, arrIncomeB, yearA, yearB){
    var mapA = {};
    for(var i=0;i<(arrIncomeA||[]).length;i++){
        var it = arrIncomeA[i]||{};
        var code = getMonthCodeByName(it.key);
        mapA[code||''] = parseFloat(it.value)||0;
    }
    var mapB = {};
    for(var j=0;j<(arrIncomeB||[]).length;j++){
        var it2 = arrIncomeB[j]||{};
        var code2 = getMonthCodeByName(it2.key);
        mapB[code2||''] = parseFloat(it2.value)||0;
    }

    var codes = monthCodeList();
    var names = monthNameList();
    var incomesA = [];
    var incomesB = [];
    var cumA = [];
    var ma3 = [];
    var rows = [];

    for(var k=0;k<codes.length;k++){
        var c = codes[k];
        var vA = mapA[c] || 0;
        var vB = mapB[c] || 0;
        incomesA.push(vA);
        if(arrIncomeB){ incomesB.push(vB); }
        rows.push({ month: names[k], income: vA });
    }

    var incomeTotalA = incomesA.reduce(function(t,x){ return t + (Number(x)||0); }, 0);
    var incomeTotalB = 0;
    for(var tb=0; tb<(incomesB||[]).length; tb++){ incomeTotalB += (Number(incomesB[tb])||0); }
    var hasCompare = !!arrIncomeB;
    var hasPrevBase = hasCompare && incomeTotalB > 0;
    var yoyPct = hasPrevBase ? ((incomeTotalA - incomeTotalB) / incomeTotalB * 100.0) : null;
    var avgA = incomeTotalA / 12.0;
    var maxA = 0; for(var ma=0; ma<(incomesA||[]).length; ma++){ if(incomesA[ma] > maxA) maxA = incomesA[ma]; }

    // cumulative + moving average(3)
    var running = 0;
    for(var i=0;i<incomesA.length;i++){
        running += (Number(incomesA[i])||0);
        cumA.push(running);
        var a0 = Number(incomesA[i])||0;
        var a1 = (i-1>=0)?(Number(incomesA[i-1])||0):a0;
        var a2 = (i-2>=0)?(Number(incomesA[i-2])||0):a1;
        ma3.push((a0+a1+a2)/3.0);
    }

    // peak/low month and volatility
    var peakIdx = 0, lowIdx = 0;
    for(var pi=0; pi<incomesA.length; pi++){
        if((Number(incomesA[pi])||0) > (Number(incomesA[peakIdx])||0)) peakIdx = pi;
        if((Number(incomesA[pi])||0) < (Number(incomesA[lowIdx])||0)) lowIdx = pi;
    }
    var mean = avgA;
    var variance = 0;
    for(var si=0; si<incomesA.length; si++){
        var dv = (Number(incomesA[si])||0) - mean;
        variance += dv*dv;
    }
    variance = variance / Math.max(1, incomesA.length);
    var std = Math.sqrt(Math.max(0, variance));
    var cv = (mean > 0) ? (std / mean) : 0;
    try{
        $('#kpiPeak').text(names[peakIdx] + ' · ' + moneyText(incomesA[peakIdx]));
        $('#kpiPeakHint').text('Spike month');
        $('#kpiLow').text(names[lowIdx] + ' · ' + moneyText(incomesA[lowIdx]));
        $('#kpiLowHint').text('Low month');
        $('#kpiVol').text((cv*100).toFixed(1) + '%');
        $('#kpiRunRate').text(moneyText(avgA * 12.0));
    }catch(e){}

    for(var r=0;r<rows.length;r++){
        rows[r].share = (incomeTotalA > 0) ? pctText((Number(rows[r].income)||0)/incomeTotalA) : '--';
    }
    $('#summaryGrid').datagrid('loadData', rows);

    // Donut/KPI cards
    try{
        // Dispose existing charts on re-render (avoid memory leaks).
        var d1 = echarts.getInstanceByDom(document.getElementById('donutTotal')); if(d1){ echarts.dispose(d1); }
        var d2 = echarts.getInstanceByDom(document.getElementById('donutAvg')); if(d2){ echarts.dispose(d2); }
        var d3 = echarts.getInstanceByDom(document.getElementById('gaugeYoY')); if(d3){ echarts.dispose(d3); }
    }catch(e){}
    try{
        $('#donutTotalText').text(moneyText(incomeTotalA));
        $('#donutAvgText').text(moneyText(avgA));
        var yoyText = (!hasCompare) ? 'Enable YoY' : (!hasPrevBase ? 'N/A' : (yoyPct>=0? ('+'+yoyPct.toFixed(1)+'%') : (yoyPct.toFixed(1)+'%')));
        $('#gaugeYoYText').text(yoyText);
    }catch(e){}

    try{
        // Total income vs prev year share
        var chartTotal = echarts.init(document.getElementById('donutTotal'));
        var prev = (arrIncomeB ? incomeTotalB : 0);
        var optionTotal = {
            tooltip: { show: true, formatter: function(){ return 'Income'; } },
            legend: { show: false },
            series: [{
                name: 'income-share',
                type: 'pie',
                radius: ['60%', '78%'],
                center: ['50%', '55%'],
                avoidLabelOverlap: true,
                label: { show: false },
                data: [
                    { value: incomeTotalA, name: 'A', itemStyle:{ color:'#10B981' } },
                    { value: prev, name: 'B', itemStyle:{ color:'#06b6d4' } }
                ],
                animation: false
            }],
            graphic: [{
                type: 'text',
                left: 'center',
                top: '46%',
                style: { text: '', fill:'#0f172a', fontSize: 12, fontWeight: 700 }
            }]
        };
        chartTotal.setOption(optionTotal, true);

        // Avg vs peak month (gives a stable visual even when YoY is off)
        var chartAvg = echarts.init(document.getElementById('donutAvg'));
        var base = (maxA > 0) ? maxA : avgA;
        var ratioAvg = base > 0 ? (avgA / base) : 0;
        ratioAvg = Math.max(0, Math.min(1, ratioAvg));
        var optionAvg = {
            legend: { show:false },
            tooltip: { show:false },
            series: [{
                name:'avg-shared',
                type:'pie',
                radius:['60%','78%'],
                center:['50%','55%'],
                avoidLabelOverlap:true,
                label:{ show:false },
                data: [
                    { value: avgA, name:'avg', itemStyle:{ color:'#0ea5e9' } },
                    { value: Math.max(0, base-avgA), name:'rest', itemStyle:{ color:'#e5e7eb' } }
                ],
                animation:false
            }]
        };
        chartAvg.setOption(optionAvg, true);

        // YoY gauge: render only when comparison year is available; keep it clean in small card.
        var chartYoY = echarts.init(document.getElementById('gaugeYoY'));
        var hasYoY = (hasPrevBase && typeof yoyPct === 'number' && isFinite(yoyPct));
        var clamp = hasYoY ? Math.max(-50, Math.min(50, yoyPct)) : 0;
        var gaugeColor = (hasYoY && yoyPct >= 0) ? '#10B981' : '#EF4444';
        var optionYoY = {
            series: [{
                type: 'gauge',
                startAngle: 180,
                endAngle: 0,
                min: -50,
                max: 50,
                center: ['50%', '62%'],
                radius: '82%',
                progress: { show: true, width: 10, itemStyle:{ color: hasYoY ? gaugeColor : '#cbd5e1' } },
                axisLine: {
                    roundCap: true,
                    // Avoid Thymeleaf inlining parsing conflicts in this JS config.
                    lineStyle: { width: 10, color: [ [1, '#e5e7eb'] ] }
                },
                splitLine: { show: false },
                axisTick: { show: false },
                axisLabel: { show: false },
                pointer: { show: hasYoY, length: '35%', width: 4, itemStyle:{ color:gaugeColor } },
                title: { show: false },
                detail: {
                    valueAnimation: false,
                    formatter: function(v){
                        if(!hasCompare){ return 'Enable YoY'; }
                        if(!hasPrevBase){ return 'N/A'; }
                        if(v===0){ return '0.0%'; }
                        return (v>0? ('+'+v.toFixed(1)+'%') : (v.toFixed(1)+'%'));
                    },
                    offsetCenter:[0,'10%'],
                    color: hasYoY ? '#0f172a' : '#64748b',
                    fontSize: 12,
                    fontWeight: 700
                }
            }]
        };
        chartYoY.setOption(optionYoY, true);
        try{ setTimeout(function(){ chartYoY.resize(); }, 0); }catch(e){}
    }catch(e){}

    echarts.dispose(document.getElementById('main'));
    var chart = echarts.init(document.getElementById('main'));

    var option = {
        title: { text: 'Income Curve · ' + yearA, left: 'left' },
        tooltip: {
            trigger: 'axis',
            formatter: function(params){
                // params: series entries at the same axis index
                var n = params && params[0] ? params[0].name : '';
                var a = 0, b = null, d = null;
                for(var i=0;i<params.length;i++){
                    var p = params[i];
                    if(p.seriesName === '收入'){ a = Number(p.value)||0; }
                    if(p.seriesName === '收入(B)'){ b = Number(p.value)||0; }
                    if(p.seriesName === '差额'){ d = Number(p.value)||0; }
                }
                var out = '月份：' + n + '<br/>收入：' + moneyText(a);
                if(b !== null){ out += '<br/>收入(B)：' + moneyText(b); }
                if(d !== null){ out += '<br/>差额：' + moneyText(d); }
                return out;
            }
        },
        legend: { data: ['收入','累计','MA(3)'].concat(arrIncomeB ? ['收入(B)','差额'] : []) },
        toolbox: { show: true, feature: { saveAsImage: {show:true} } },
        grid: { left: 52, right: 20, bottom: 70, top: 48 },
        xAxis: [{ type:'category', boundaryGap:false, data:names }],
        yAxis: [
            { type:'value', axisLabel:{ formatter:'¥{value}' }, splitArea:{ show:true } },
            { type:'value', axisLabel:{ formatter:'' }, splitLine:{ show:false } }
        ],
        series: [
            { name:'收入', type:'line', data: incomesA, itemStyle:{ color:'#10B981' }, smooth:true, areaStyle:{ color:'rgba(16,185,129,0.12)'},
              markPoint:{ data:[{type:'max',name:'Max'},{type:'min',name:'Min'}] } },
            { name:'MA(3)', type:'line', data: ma3, smooth:true, symbol:'none', lineStyle:{ width:2, color:'#0ea5e9' } },
            { name:'累计', type:'line', data: cumA, smooth:true, symbol:'none', yAxisIndex:1, lineStyle:{ width:2, color:'#64748b' } }
        ]
    };

    if(arrIncomeB){
        option.series.push({ name:'收入(B)', type:'line', data: incomesB, itemStyle:{ color:'#06b6d4' }, smooth:true, lineStyle:{ type:'dashed'} });
        var delta = [];
        for(var di=0; di<incomesA.length; di++){
            delta.push( (Number(incomesA[di])||0) - (Number(incomesB[di])||0) );
        }
        option.series.push({ name:'差额', type:'bar', data: delta, itemStyle:{ color:'rgba(37,99,235,0.35)' } });
    }
    chart.setOption(option);

    // Category breakdown (pie + note)
    renderIncomeCategoryBreakdown(yearA);
}

function renderIncomeCategoryBreakdown(year){
    var y = String(year||'').trim();
    if(!/^\d{4}$/.test(y)){ return; }
    var base = getParamsBase();
    // Use full year window for category breakdown.
    var start = '01/01/' + y;
    var end = '12/31/' + y;
    var params = $.extend({}, base, { transactionDateStartStr: start, transactionDateEndStr: end, txnTypes: 'income' });
    transaction.consumeReport(params, function(res){
        var list = [];
        try{
            if(isSuccessResult(res)){
                var rows = $.parseJSON(getResultData(res)||'[]')||[];
                for(var i=0;i<rows.length;i++){
                    var r = rows[i] || {};
                    var v = Number(r.value||0);
                    if(!isFinite(v)) v = 0;
                    list.push({ name: String(r.key||''), value: Math.abs(v) });
                }
            }
        }catch(e){}
        list.sort(function(a,b){ return (b.value||0) - (a.value||0); });
        var total = 0;
        for(var t=0;t<list.length;t++){ total += (Number(list[t].value)||0); }
        var topN = 8;
        var agg = [];
        var others = 0;
        for(var k=0;k<list.length;k++){
            if(k < topN){ agg.push(list[k]); }
            else { others += (Number(list[k].value)||0); }
        }
        if(list.length > topN && others > 0){
            agg.push({ name:'Others', value: others });
        }
        try{
            var note = (total > 0 && agg.length) ? ('Top ' + Math.min(topN, list.length) + ' cover ' + ( (agg.slice(0,Math.min(topN,agg.length)).reduce(function(s,x){return s+(x.value||0);},0) / total)*100 ).toFixed(1) + '%') : 'No breakdown data';
            $('#pieNote').text(note);
        }catch(e){}
        try{
            var dom = document.getElementById('pieIncome');
            if(!dom){ return; }
            var inst = echarts.getInstanceByDom(dom);
            if(inst){ echarts.dispose(inst); }
            var pie = echarts.init(dom);
            pie.setOption({
                tooltip: { trigger:'item', formatter:function(p){ return (p.name||'') + '<br/>' + moneyText(p.value) + ' (' + (p.percent||0).toFixed(1) + '%)'; } },
                legend: { type:'scroll', orient:'vertical', left: 10, top: 10, bottom: 10 },
                series: [{
                    type:'pie',
                    radius:['55%','78%'],
                    center:['70%','52%'],
                    minAngle:2,
                    label:{ formatter:function(p){ return p.name + '\\n' + moneyText(p.value); } },
                    data: agg
                }]
            }, true);
            setTimeout(function(){ try{ pie.resize(); }catch(e){} }, 0);
        }catch(e){}
    }, function(){});
}
</script>
