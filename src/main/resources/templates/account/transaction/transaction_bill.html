<script type="text/javascript">
var datagrid = '#datagrid';
var editIndex = undefined;
$(function() {
    $(datagrid).datagrid({
        method:'post',
        title:'Total:<span id="totalConsume" style="color:red">0</span>',
        url: '/transaction/getTransactions',
        fitColumns:true,
        striped:true,
        autoRowHeight:true,
        scrollbarSize:14,
        onDblClickRow:function(rowIndex, rowData){
            $(this).datagrid('cancelEdit', editIndex);
            editIndex = rowIndex;
            $(this).datagrid('beginEdit', rowIndex);
        },
		onClickRow:function(rowIndex, rowData){
			$(this).datagrid('cancelEdit', editIndex);
		},
		onLoadSuccess:function(data){
			var rowDatas = data.rows;
			if(rowDatas != undefined && rowDatas.length > 0){
				var total = 0;
				for(var i=0;i<rowDatas.length;i++){
					total += rowDatas[i].balanceMoney;
				}
				$("#totalConsume").html(Math.abs(Math.round(total)));
			}
		}
	});
	
	var pager = $(datagrid).datagrid('getPager'); // get the pager of datagrid
	pager.pagination({
	    pageSize: 200,
	    pageList: [50, 100, 150, 200, 500],
	    buttons : [ {
			iconCls : 'icon-cancel',
			handler : deleteTransaction
		}, {
			iconCls : 'icon-edit',
			handler : function() {
				alert('edit');
			}
		}, {
			iconCls : 'icon-save',
			handler : updateTransaction
		} , {
			iconCls : 'icon-undo',
			handler : cancelEdit
		}]
	});
});

$(function(){
    $.parser.onComplete = function(){
        $('#dateStart').datebox({onSelect:function(){searchTransactions();}});
        $('#dateEnd').datebox({onSelect:function(){searchTransactions();}});
        
        $('#cmbCardTypes').combobox({onSelect:function(){searchTransactions();},onShowPanel:function(){ $('#cmbCardTypes').combobox('reload'); }});
        $('#cmbCardTypes').combobox('reload');
        $('#cmbConsume').combotree({
            url:'/api/v1/consume/tree',
            method:'get',
            loadFilter:function(data){
                function mapNode(n){
                    if(!n) return n;
                    var code = n.id || '';
                    var name = n.text || '';
                    n.text = (code ? code : '') + (name ? ('  ' + name) : '');
                    if(n.children && n.children.length){
                        for(var i=0;i<n.children.length;i++){ n.children[i] = mapNode(n.children[i]); }
                    }
                    return n;
                }
                if($.isArray(data)){
                    for(var i=0;i<data.length;i++){ data[i] = mapNode(data[i]); }
                } else { data = mapNode(data); }
                return data;
            },
            onLoadSuccess:function(){ try{$('#cmbConsume').combotree('tree').tree('collapseAll');}catch(e){} },
            onChange:function(){searchTransactions();},
            onShowPanel:function(){
                try{
                    var treeObj = $('#cmbConsume').combotree('tree');
                    setTimeout(function(){ try{ treeObj.tree('collapseAll'); }catch(e){} }, 0);
                }catch(e){}
            }
        });
        try{$('#cmbConsume').combotree('reload','/api/v1/consume/tree');}catch(e){}
        $('#cmbConsumeFilter').combobox({onChange:function(){searchTransactions();}});
    };
});

function deleteTransaction(){
	var rowData = $(datagrid).datagrid("getSelected");
	if(rowData != null){
		$.messager.confirm('Confirm', 'Do you want to delete this transaction record？', function(r){
			if (r){
			    transaction.deleteTransaction({'id':rowData.id}, function(data){
			    	if(data.returnCode == 'success'){
			    		$(datagrid).datagrid('reload');
			    		app.messager.show({title:'Success', msg:'Success to delete this transaction record!'});
			    	}else{
			    		app.messager.show({title:'Fail', msg: data.returnMessage});
			    	}
			    },function(e){
					app.messager.show({title:'Error', msg: e.message});
				})
			}
		});
	}else{
		app.messager.show({title:'Delete transaction record', msg:'Please select one transaction record!'});
	}
}
	
var fmt = {
	consumptionType:function(value,row){
	           if (value == 0) {
		        return;
		 }
		var consumptionTypes = transaction_datasource.consumptionType;
		for (var i = 0; i < consumptionTypes.length; i++) {
			if (consumptionTypes[i].id == value) {
		    	return consumptionTypes[i].text;
		    }
		}
	},
    consume:function(value,row){
        var consumeTarget = consume_operate.find(value);
        if(consumeTarget){ return consumeTarget.text; }
        return "";
    }
}

var consume_operate = {};

function updateTransaction() {
	var rowData = $(datagrid).datagrid('getSelected');
	if(!rowData){ app.messager.show({title:'Save', msg:'Please select one row to save'}); return; }
	var rowIndex = $(datagrid).datagrid('getRowIndex',rowData);
	var consumptionTypeEditor = $(datagrid).datagrid('getEditor', {index:rowIndex,field:'consumptionType'});
	var consumptionType = (function(){
	    try{ if(consumptionTypeEditor && consumptionTypeEditor.target){ return $(consumptionTypeEditor.target).combobox('getValue'); } }catch(e){}
	    return rowData.consumptionType;
	})();
    var consumeEditor = $(datagrid).datagrid('getEditor', {index:rowIndex,field:'consumeCode'});
    var consumeCode = (function(){
        try{ if(consumeEditor && consumeEditor.target){ return $(consumeEditor.target).combotree('getValue'); } }catch(e){}
        return rowData.consumeCode || '';
    })();
    var consumeText = (function(){
        try{ if(consumeEditor && consumeEditor.target){ return $(consumeEditor.target).combotree('getText'); } }catch(e){}
        return (rowData.consumeCode ? (rowData.consumeCode + '  ' + (rowData.consumeName||'')) : (rowData.consumeName||''));
    })();
    var consumeName = (function(){
        var t = $.trim(consumeText||'');
        var c = $.trim(consumeCode||'');
        if(!t){ return $.trim(rowData.consumeName||''); }
        if(c && t.indexOf(c) === 0){
            var s = t.substring(c.length);
            return $.trim(s);
        }
        return t;
    })();
	var demoAreaEditor = $(datagrid).datagrid('getEditor', {index:rowIndex,field:'demoArea'});
	var demoArea = (function(){
	    try{ if(demoAreaEditor && demoAreaEditor.target){ return $(demoAreaEditor.target).textbox('getText'); } }catch(e){}
	    return rowData.demoArea || '';
	})();
	try{ $(datagrid).datagrid('endEdit', rowIndex); }catch(e){}
    var params = {'id':rowData.id, 'consumptionType':consumptionType,'demoArea':$.trim(demoArea),'consumeCode':consumeCode,'consumeName':consumeName};
	transaction.updateTransaction(params, function(data){
    	if(data.returnCode == 'success'){
    		$(datagrid).datagrid('reload');
    	}else{
    		app.messager.show({title:'Fail', msg: data.returnMessage});
    	}
    });
}

function cancelEdit() {
	var rows = $(datagrid).datagrid('getRows');
	for (var i = 0; i < rows.length; i++) {
		$(datagrid).datagrid('cancelEdit', i);
	}
}

function autoClassify(){
    var row = $(datagrid).datagrid('getSelected');
    if(row){
        var idx = $(datagrid).datagrid('getRowIndex', row);
        try{ $(datagrid).datagrid('selectRow', idx); }catch(e){}
        var params = { transactionDesc: row.transactionDesc, cardTypeName: row.cardTypeName, balanceMoney: row.balanceMoney, bookKeepingDate: row.bookKeepingDate };
        transaction.classify(params, function(res){
            if(res && res.returnCode === 'success'){
                var arr = [];
                try{ arr = JSON.parse(res.returnMessage || '[]'); }catch(ex){ arr = []; }
                if(!arr || !arr.length){ arr = [{id:'OTHER-01', name:'Uncategorized Expense'}]; }
                var dlgId = 'autoClassifyDlg_'+Math.floor(Math.random()*1000000);
                var html = '<div id="'+dlgId+'" style="padding:12px;">'+
                    '<form style="max-height:280px;overflow:auto;margin-bottom:0;">';
                for(var i=0;i<arr.length;i++){
                    var item = arr[i]||{};
                    var code = $.trim(item.id||'');
                    var name = $.trim(item.name||'');
                    var text = (code?code:'')+(name?('  '+name):'');
                    var checked = i===0? ' checked' : '';
                    html += '<label style="display:block;padding:8px 10px;border:1px solid #d0d0d0;border-radius:6px;margin-bottom:8px;background:#fafafa;">'
                        + '<input type="radio" name="ac-radio" value="'+code+'" data-name="'+name+'"'+checked+' style="margin-right:8px;">'
                        + text + '</label>';
                }
                html += '</form>'+
                    '<div style="padding-top:8px;border-top:1px dashed #ddd;margin-top:8px;">'+
                    '<div style="margin-bottom:4px;">'+
                    '<span style="display:inline-block;width:70px;">Category</span>'+
                    '<select id="ac_category" class="easyui-combotree" style="width:420px;"></select>'+
                    '</div>'+
                    '</div>'+
                    '</div>';
                var $dlg = $(html).appendTo('body');
                $dlg.dialog({
                    title:'Top 5 Best Matches',
                    width:480,
                    modal:true,
                    buttons:[{
                        text:'Apply',
                        iconCls:'icon-ok',
                        handler:function(){
                            var code = '';
                            var name = '';
                            try{ code = $.trim($('#ac_category').combotree('getValue')||''); name = $.trim($('#ac_category').combotree('getText')||''); }catch(e){}
                            if(!code){
                                var $sel = $dlg.find('input[name="ac-radio"]:checked');
                                code = $.trim($sel.val()||'');
                                name = $.trim($sel.attr('data-name')||'');
                            }
                            if(!code){ return; }
                            if(code && name && name.indexOf(code) === 0){ name = $.trim(name.substring(code.length)); }
                            transaction.updateTransaction({id:row.id, consumeCode:code, consumeName:name}, function(dr){
                                if(dr && dr.returnCode === 'success'){ $(datagrid).datagrid('reload'); try{ $dlg.dialog('close'); }catch(e){} }
                                else { app.messager.show({title:'Fail', msg:(dr && dr.returnMessage) || 'Update failed'}); }
                            }, function(e){ app.messager.show({title:'Error', msg: e.message || 'Network error'}); });
                        }
                    },{
                        text:'Cancel',
                        iconCls:'icon-cancel',
                        handler:function(){ try{ $dlg.dialog('close'); }catch(e){} }
                    }],
                    onClose:function(){ try{ $dlg.dialog('destroy'); $dlg.remove(); }catch(e){} }
                });
                try{
                    $('#ac_category').combotree({url:'/api/v1/consume/tree', method:'get',
                        loadFilter:function(data){
                            function mapNode(n){
                                if(!n) return n;
                                var code=n.id||'';var name=n.text||'';
                                n.text=(code?code:'')+(name?('  '+name):'');
                                if(n.children&&n.children.length){for(var i=0;i<n.children.length;i++){n.children[i]=mapNode(n.children[i]);}}
                                return n;
                            }
                            if($.isArray(data)){ for(var i=0;i<data.length;i++){ data[i]=mapNode(data[i]); } } else { data = mapNode(data); }
                            return data;
                        },
                        onShowPanel:function(){ try{$('#ac_category').combotree('tree').tree('collapseAll');}catch(e){} },
                        onLoadSuccess:function(){ try{$('#ac_category').combotree('tree').tree('collapseAll');}catch(e){} }
                    });
                }catch(e){}
                try{ $(datagrid).datagrid('selectRow', idx); }catch(e){}
            } else {
                app.messager.show({title:'Auto Classify', msg:(res && res.returnMessage) || 'No match'});
            }
        }, function(e){ app.messager.show({title:'Error', msg: e.message || 'Network error'}); });
        return;
    }
    var rows = $(datagrid).datagrid('getRows') || [];
    var targets = [];
    for(var i=0;i<rows.length;i++){
        var r = rows[i]||{};
        var cc = $.trim(r.consumeCode||'');
        var cn = $.trim(r.consumeName||'');
        if(!cc || !cn){ targets.push(r); }
    }
    if(!targets.length){ app.messager.show({title:'Classify', msg:'No unclassified records in current page'}); return; }
    var msg = 'This will auto classify only unclassified records in current page.\nCount: ' + targets.length + '\nUse top recommendation for each.\nContinue?';
    $.messager.confirm('Confirm', msg, function(r){
        if(!r) return;
        var dlgId = 'batchClassifyDlg_'+Math.floor(Math.random()*1000000);
        var html = '<div id="'+dlgId+'" style="padding:12px;">'
            + '<div style="margin-bottom:8px;">Pending: <span id="'+dlgId+'_pending">'+targets.length+'</span></div>'
            + '<div>Done: <span id="'+dlgId+'_done">0</span> , Failed: <span id="'+dlgId+'_fail">0</span></div>'
            + '<div style="margin-top:10px;height:8px;background:#e9e9e9;border-radius:4px;"><div id="'+dlgId+'_bar" style="height:8px;width:0;background:#3fa7ff;border-radius:4px;"></div></div>'
            + '<div style="margin-top:8px;color:#666;">The dialog will remain open. You can close it when finished.</div>'
            + '</div>';
        var $dlg = $(html).appendTo('body');
        var stop = false;
        function updateBar(done,total){ var p = total<=0?0:Math.round(done*100/total); $('#'+dlgId+'_bar').css('width', p+'%'); }
        $dlg.dialog({
            title:'Batch Classify',
            width:380,
            modal:true,
            buttons:[{
                text:'Stop',
                iconCls:'icon-cancel',
                handler:function(){ stop=true; }
            }],
            onClose:function(){ try{ $dlg.dialog('destroy'); $dlg.remove(); }catch(e){} }
        });
        var total = targets.length, done = 0, fail = 0, idx = 0;
        function next(){
            if(stop) return;
            if(idx >= total){ $(datagrid).datagrid('reload'); return; }
            var it = targets[idx++]; $('#'+dlgId+'_pending').text(total - idx);
            var params = { transactionDesc: it.transactionDesc, cardTypeName: it.cardTypeName, balanceMoney: it.balanceMoney, bookKeepingDate: it.bookKeepingDate };
            transaction.classify(params, function(res){
                var arr = [];
                try{ if(res && res.returnCode==='success'){ arr = JSON.parse(res.returnMessage||'[]'); } }catch(ex){ arr = []; }
                if(arr && arr.length){
                    var best = arr[0]||{};
                    var code = $.trim(best.id||''); var name = $.trim(best.name||'');
                    if(code){
                        transaction.updateTransaction({id:it.id, consumeCode:code, consumeName:name}, function(dr){
                            if(dr && dr.returnCode==='success'){ done++; $('#'+dlgId+'_done').text(done); }
                            else { fail++; $('#'+dlgId+'_fail').text(fail); }
                            updateBar(done+fail, total); setTimeout(next, 10);
                        }, function(){ fail++; $('#'+dlgId+'_fail').text(fail); updateBar(done+fail, total); setTimeout(next, 10); });
                        return;
                    }
                }
                fail++; $('#'+dlgId+'_fail').text(fail); updateBar(done+fail, total); setTimeout(next, 10);
            }, function(){ fail++; $('#'+dlgId+'_fail').text(fail); updateBar(done+fail, total); setTimeout(next, 10); });
        }
        next();
    });
}

function searchTransactions(){
    var params = {};
    params.transactionDateStartStr = $('#dateStart').datebox('getValue');
    params.transactionDateEndStr = $('#dateEnd').datebox('getValue');
    params.cardId = $('#cmbCardTypes').combobox('getValue');
    params.consumeID = (function(){
        try{
            var t = $('#cmbConsume').combotree('tree');
            var nodes = t.tree('getChecked');
            var ids = [];
            for(var i=0;i<nodes.length;i++){ ids.push(nodes[i].id); }
            return ids.join(',');
        }catch(e){ return ''; }
    })();
    params.emptyConsume = $('#cmbConsumeFilter').combobox('getValue') === 'empty';
    params.demoArea = $('#txtDemo').textbox('getValue');
    $(datagrid).datagrid('load', params);
}

function genKeywords(){
    var row = $(datagrid).datagrid('getSelected');
    if(!row){ app.messager.show({title:'Keywords', msg:'Please select a transaction'}); return; }
    
    // 1. Fetch Keywords
    $.post('/transaction/keywords', {transactionDesc: row.transactionDesc}, function(res){
        var keywords = '';
        if(res && res.returnCode === 'success'){
            try{ keywords = JSON.parse(res.returnMessage || '[]').join('|'); }catch(e){}
        }
        
        // 2. Fetch Recommendations
        var params = { transactionDesc: row.transactionDesc, cardTypeName: row.cardTypeName, balanceMoney: row.balanceMoney, bookKeepingDate: row.bookKeepingDate };
        transaction.classify(params, function(resClassify){
            var recs = [];
            try{ if(resClassify && resClassify.returnCode==='success'){ recs = JSON.parse(resClassify.returnMessage||'[]'); } }catch(ex){}
            
            showKeywordDialog(row, keywords, recs);
        });
    });
}

function showKeywordDialog(row, keywords, recs){
    var dlgId = 'keywordDlg_'+Math.floor(Math.random()*1000000);
    var html = '<div id="'+dlgId+'" style="padding:14px 16px;">'
        + '<div style="margin-bottom:6px;font-weight:600;">Source</div>'
        + '<input class="easyui-textbox" style="width:100%;" value="'+(row.transactionDesc||'')+'" readonly>'
        + '<div style="margin:12px 0 6px;font-weight:600;">Keywords</div>'
        + '<input id="'+dlgId+'_kw" class="easyui-textbox" style="width:100%;" value="'+keywords+'">'
        + '<div style="margin:12px 0 6px;font-weight:600;">Categories</div>'
        + '<div id="'+dlgId+'_recs" style="margin-bottom:10px;max-height:150px;overflow-y:auto;"></div>'
        + '<div style="margin-bottom:6px;">Pick manually</div>'
        + '<select id="'+dlgId+'_manual" class="easyui-combotree" style="width:100%;"></select>'
        + '<div id="'+dlgId+'_status" style="margin-top:10px;min-height:20px;color:green;font-weight:bold;"></div>'
        + '</div>';
    
    var $dlg = $(html).appendTo('body');
    
    // Render Recommendations
    var $recs = $('#'+dlgId+'_recs');
    if(recs && recs.length){
        var htmlRecs = '';
        for(var i=0;i<Math.min(5, recs.length);i++){
            var it = recs[i]||{};
            var code = $.trim(it.id||''); var name = $.trim(it.name||'');
            var text = (code?code:'') + (name?('  '+name):'');
            var checked = i===0 ? 'checked' : '';
            htmlRecs += '<label style="display:block;padding:6px 8px;border:1px solid #eee;border-radius:4px;margin-bottom:6px;cursor:pointer;">'
                + '<input type="radio" name="kw-cat" value="'+code+'" '+checked+'> ' + text + '</label>';
        }
        $recs.html(htmlRecs);
    } else {
        $recs.html('<div style="color:#999;font-style:italic;">No recommendations</div>');
    }
    
    // Initialize EasyUI components
    $.parser.parse($('#'+dlgId));
    
    // Load Manual Combotree
    $('#'+dlgId+'_manual').combotree({
        url:'/api/v1/consume/tree', method:'get',
        loadFilter:function(data){
             function mapNode(n){
                if(!n) return n;
                var code=n.id||'';var name=n.text||'';
                n.text=(code?code:'')+(name?('  '+name):'');
                if(n.children&&n.children.length){for(var i=0;i<n.children.length;i++){n.children[i]=mapNode(n.children[i]);}}
                return n;
            }
            if($.isArray(data)){ for(var i=0;i<data.length;i++){ data[i]=mapNode(data[i]); } } else { data = mapNode(data); }
            return data;
        },
        onLoadSuccess:function(){ try{$(this).combotree('tree').tree('collapseAll');}catch(e){} }
    });

    $dlg.dialog({
        title:'Keyword',
        width:500,
        height:'auto',
        modal:true,
        buttons:[{
            text:'Save Rules',
            iconCls:'icon-save',
            handler:function(){
                var patternStr = $('#'+dlgId+'_kw').textbox('getValue');
                if(!patternStr){ app.messager.show({title:'Error', msg:'Keywords cannot be empty'}); return; }
                var catId = $('#'+dlgId+'_manual').combotree('getValue');
                if(!catId){ catId = $dlg.find('input[name="kw-cat"]:checked').val(); }
                if(!catId){ app.messager.show({title:'Error', msg:'Please select a category'}); return; }
                var raw = (patternStr||'').split('|');
                var tokens = [];
                var seen = {};
                for(var i=0;i<raw.length;i++){
                    var t = $.trim(raw[i]||'');
                    if(t && !seen[t]){ seen[t] = true; tokens.push(t); }
                }
                if(!tokens.length){ app.messager.show({title:'Error', msg:'No valid keywords'}); return; }
                var saved = 0, failed = 0, idx = 0;
                function updateStatus(){
                    var cn = '已保存 ' + saved + ' 条规则' + (failed>0 ? ('，失败 ' + failed + ' 条') : '');
                    var en = '(Saved ' + saved + ' rules' + (failed>0 ? (', failed ' + failed) : '') + ')';
                    $('#'+dlgId+'_status').text(cn + ' ' + en);
                }
                updateStatus();
                function next(){
                    if(idx >= tokens.length){ return; }
                    var rule = { categoryId: catId, pattern: tokens[idx++], patternType: 'contains', priority: 100, active: 1 };
                    $.ajax({
                        url: '/api/v1/consume/rules',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(rule),
                        success: function(){
                            saved++; updateStatus(); next();
                        },
                        error: function(){
                            failed++; updateStatus(); next();
                        }
                    });
                }
                next();
            }
        }],
        onClose:function(){ try{ $dlg.dialog('destroy'); $dlg.remove(); }catch(e){} }
    });
}

function batchSetCategory(){
    var selections = $(datagrid).datagrid('getSelections') || [];
    var currentRows = $(datagrid).datagrid('getRows') || [];
    if(!selections.length && !currentRows.length){ app.messager.show({title:'Batch Set Category', msg:'No data'}); return; }
    var dlgId = 'batchCatDlg_'+Math.floor(Math.random()*1000000);
    var html = '<div id="'+dlgId+'" style="padding:14px 16px;">'
        + '<div style="margin-bottom:10px;font-weight:600;">Apply Scope</div>'
        + '<div style="margin-bottom:12px;">'
        + '<label style="margin-right:18px;"><input type="radio" name="bc-scope" value="selected" checked> Selected Rows ('+selections.length+')</label>'
        + '<label style="margin-right:18px;"><input type="radio" name="bc-scope" value="page"> Current Page ('+currentRows.length+')</label>'
        + '<label style="margin-left:10px;"><input type="checkbox" id="bc-only-unclassified"> Only Unclassified</label>'
        + '</div>'
        + '<div style="margin:8px 0 6px;font-weight:600;">Recommended</div>'
        + '<div id="'+dlgId+'_recs" style="margin-bottom:10px;"></div>'
        + '<div style="margin:8px 0 6px;font-weight:600;">Category</div>'
        + '<select id="'+dlgId+'_category" class="easyui-combotree" style="width:380px;"></select>'
        + '<div style="margin-top:12px;color:#666;">Pending: <span id="'+dlgId+'_pending">0</span> , Done: <span id="'+dlgId+'_done">0</span> , Failed: <span id="'+dlgId+'_fail">0</span></div>'
        + '<div style="margin-top:8px;height:8px;background:#e9e9e9;border-radius:4px;"><div id="'+dlgId+'_bar" style="height:8px;width:0;background:#3fa7ff;border-radius:4px;"></div></div>'
        + '</div>';
    var $dlg = $(html).appendTo('body');
    $dlg.dialog({
        title:'Batch Set Category',
        width:520,
        top: 60,
        modal:true,
        buttons:[{
            text:'Apply',
            iconCls:'icon-ok',
            handler:function(){
                var scope = $dlg.find('input[name="bc-scope"]:checked').val();
                var onlyUn = $('#bc-only-unclassified').is(':checked');
                var targets = scope==='page' ? currentRows.slice(0) : selections.slice(0);
                if(onlyUn){
                    var filtered = [];
                    for(var i=0;i<targets.length;i++){
                        var r = targets[i]||{};
                        var cc = $.trim(r.consumeCode||'');
                        var cn = $.trim(r.consumeName||'');
                        if(!cc || !cn){ filtered.push(r); }
                    }
                    targets = filtered;
                }
                if(!targets.length){
                    $('#'+dlgId+'_recs').html('<div style="color:red;font-weight:bold;">No targets found. Please check "Only Unclassified" filter.</div>');
                    return;
                }
                var code = '', name = '';
                try{ code = $('#'+dlgId+'_category').combotree('getValue'); name = $('#'+dlgId+'_category').combotree('getText'); }catch(e){}
                if(!code){
                    var $sel = $dlg.find('input[name="bc-rec"]:checked');
                    code = $.trim(($sel.val()||'')); name = $.trim(($sel.attr('data-name')||''));
                }
                if(!code){ app.messager.show({title:'Batch Set Category', msg:'Please choose a category'}); return; }
                if(name && name.indexOf(code)===0){ name = $.trim(name.substring(code.length)); }
                var total = targets.length;
                $('#'+dlgId+'_pending').text(total);
                function updateBar(d){ var p = total<=0?0:Math.round(d*100/total); $('#'+dlgId+'_bar').css('width', p+'%'); }
                var payload = [];
                for(var i=0;i<targets.length;i++){
                    var it = targets[i]||{};
                    payload.push({id:it.id, consumeCode:code, consumeName:name});
                }
                transaction.updateTransactionsBatch(payload, function(res){
                    var success = 0, failed = 0;
                    try{
                        if(res && res.returnCode==='success'){
                            var r = JSON.parse(res.returnMessage||'{}');
                            success = Number(r.success||0);
                            failed = Number(r.failed||0);
                        }
                    }catch(e){}
                    $('#'+dlgId+'_pending').text(0);
                    $('#'+dlgId+'_done').text(success);
                    $('#'+dlgId+'_fail').text(failed);
                    updateBar(success+failed);
                    $(datagrid).datagrid('reload');
                    try{$dlg.dialog('close');}catch(e){}
                }, function(){
                    $('#'+dlgId+'_pending').text(0);
                    $('#'+dlgId+'_fail').text(total);
                    updateBar(total);
                });
            }
        },{
            text:'Cancel',
            iconCls:'icon-cancel',
            handler:function(){ try{$dlg.dialog('close');}catch(e){} }
        }],
        onClose:function(){ try{$dlg.dialog('destroy'); $dlg.remove();}catch(e){} }
    });
    setTimeout(function(){
        $('#'+dlgId+'_category').combotree({
            url:'/api/v1/consume/tree',
            method:'get',
            loadFilter:function(data){
                function mapNode(n){
                    if(!n) return n;
                    var code = n.id || '';
                    var name = n.text || '';
                    n.text = (code ? code : '') + (name ? ('  ' + name) : '');
                    if(n.children && n.children.length){
                        for(var i=0;i<n.children.length;i++){ n.children[i] = mapNode(n.children[i]); }
                    }
                    return n;
                }
                if($.isArray(data)){
                    for(var i=0;i<data.length;i++){ data[i] = mapNode(data[i]); }
                } else { data = mapNode(data); }
                return data;
            },
            onShowPanel:function(){ try{$('#'+dlgId+'_category').combotree('tree').tree('collapseAll');}catch(e){} },
            onLoadSuccess:function(){ try{$('#'+dlgId+'_category').combotree('tree').tree('collapseAll');}catch(e){} }
        });
        var sample = null;
        if(selections.length){
            sample = selections[0];
        } else if(currentRows.length){
            sample = currentRows[0];
        }
        if(sample){
            var params = { transactionDesc: sample.transactionDesc, cardTypeName: sample.cardTypeName, balanceMoney: sample.balanceMoney, bookKeepingDate: sample.bookKeepingDate };
            transaction.classify(params, function(res){
                var arr = [];
                try{ if(res && res.returnCode==='success'){ arr = JSON.parse(res.returnMessage||'[]'); } }catch(ex){ arr = []; }
                var $recs = $('#'+dlgId+'_recs');
                if(arr && arr.length){
                    var html = '';
                    var max = Math.min(5, arr.length);
                    for(var i=0;i<max;i++){
                        var it = arr[i]||{};
                        var code = $.trim(it.id||''); var name = $.trim(it.name||''); var checked = i===0?' checked':'';
                        var text = (code?code:'') + (name?('  '+name):'');
                        html += '<label style="display:block;padding:8px 10px;border:1px solid #d0d0d0;border-radius:6px;margin-bottom:8px;background:#fafafa;">'
                            + '<input type="radio" name="bc-rec" value="'+code+'" data-name="'+name+'"'+checked+' style="margin-right:8px;">'
                            + text + '</label>';
                    }
                    $recs.html(html);
                } else {
                    $recs.html('<div style="color:#888;">No recommendation</div>');
                }
            }, function(){ $('#'+dlgId+'_recs').html('<div style="color:#888;">Network error</div>'); });
        } else {
            $('#'+dlgId+'_recs').html('<div style="color:#888;">No recommendation</div>');
        }
    }, 50);
}
</script>
</html>
