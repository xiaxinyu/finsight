<html>
<head>
    <title>== Income vs Expense · Monthly Trend ==</title>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.min.js"></script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.easyui.min.js"></script>
    <script type="text/javascript" src="/scripts/app-plugin.js"></script>
    <script type="text/javascript" src="/scripts/date.js"></script>
    <script type="text/javascript" src="/plugins/echarts-6.0.0/echarts.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/bootstrap/easyui.css">
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/icon.css">
    <script type="text/javascript" src="/scripts/transaction.js"></script>
    <script type="text/javascript" src="/datasource/transaction-datasource.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/default/transaction/TransactionBill.css">
</head>
<body class="easyui-layout">
<div data-options="region:'north',border:true" style="height: 56px">
    <div style="margin-top: 4px;">
        <span class="item_intervel">
            <label>Year：</label>
            <select id="cmbYear" class="easyui-combobox" style="width:90px;" data-options="onSelect:statistic">
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="2019">2019</option>
                <option value="2018">2018</option>
                <option value="2017">2017</option>
                <option value="2016">2016</option>
                <option value="2015">2015</option>
                <option value="2014">2014</option>
                <option value="2013">2013</option>
            </select>
        </span>
        <span class="item_intervel">
            <label>Card：</label>
            <input id="cmbCardTypes" class="easyui-combobox"
                   data-options="data:transaction_datasource.cardTypes,valueField:'id',textField:'text',onSelect:statistic,editable:false,prompt:'All cards'"
                   style="width: 160px;">
        </span>
        <span class="item_intervel">
            <label>Description：</label>
            <input id="txtDemo" class="easyui-textbox" style="width:160px">
        </span>
        <span class="item_intervel">
            <a class="easyui-linkbutton" data-options="iconCls:'icon-search'" onclick="statistic()">Statistic</a>
        </span>
    </div>
}
</div>
<div id="chartArea" data-options="region:'center',border:false">
    <div id="main" style="margin-top: 12px; width:100%; height: 420px;"></div>
    <div style="margin-top: 12px;">
        <table id="summaryGrid" class="easyui-datagrid" fit="true"
               data-options="rownumbers:true,singleSelect:true,border:true,fitColumns:true" style="width:100%;height:260px;">
            <thead>
            <tr>
                <th data-options="field:'month',width:120">Month</th>
                <th data-options="field:'income',width:120,align:'right',formatter:app.money.rmb">Income</th>
                <th data-options="field:'expense',width:120,align:'right',formatter:app.money.rmb">Expense</th>
                <th data-options="field:'surplus',width:120,align:'right',formatter:app.money.rmb">Surplus</th>
            </tr>
            </thead>
        </table>
    </div>
</div>

<div id="dialog" style="display:none;">
    <table id="datagrid" fit="true"
           data-options="rownumbers:true,singleSelect:true,pagination:true,pageSize:50,border:false" style="width:100%;height:480px;">
        <thead>
        <tr>
            <th data-options="field:'id',hidden:true">ID</th>
            <th data-options="field:'bankCardName',width:160">Card</th>
            <th data-options="field:'transactionDate',width:100,align:'center',formatter:app.date.format">Book date</th>
            <th data-options="field:'balanceMoney',width:120,align:'right',formatter:app.money.rmb">Amount</th>
            <th data-options="field:'consumeName',width:160,align:'left'">Category</th>
            <th data-options="field:'demoArea',width:420,align:'left'">Description</th>
        </tr>
        </thead>
    </table>
</div>

<script type="text/javascript">
$(function(){
    $.parser.onComplete = function(){
        ensureMainSize();
        statistic();
        $(window).on('resize', ensureMainSize);
    };
});

function ensureMainSize(){
    var $area = $('#chartArea');
    var $main = $('#main');
    var h = $area.height();
    if(!h || h <= 80){ h = $(window).height() - 140; }
    if(h && h > 120){ $main.height(h - 320); }
}

function safeComboboxValue(sel){ var jq=$(sel); try{ var v=jq.combobox('getValue'); if(v!=null) return $.trim(v);}catch(e){} var v2=jq.val(); return v2?$.trim(v2):''; }
function safeTextboxValue(sel){ var jq=$(sel); try{ return $.trim(jq.textbox('getValue')); }catch(e){ return $.trim(jq.val()||''); } }
function isSuccessResult(res){
    try{ return !!(res && app.api && app.api.normalizeResult && app.api.normalizeResult(res).ok); }catch(e){}
    return !!(res && (res.returnCode === 'success' || res.code === 20000 || res.code === 200));
}
function getResultData(res){
    try{
        if(res && app.api && app.api.normalizeResult){
            return app.api.normalizeResult(res).data;
        }
    }catch(e){}
    return res ? res.returnMessage : null;
}

function getParamsBase(){
    var year = safeComboboxValue('#cmbYear');
    var cardtype = safeComboboxValue('#cmbCardTypes'); if(cardtype==='0') cardtype='';
    var demoArea = safeTextboxValue('#txtDemo');
    return {'year':year,'cardTypeName':cardtype,'demoArea':demoArea};
}

function statistic(){
    var base = getParamsBase();
    var pIncome = $.extend({}, base, {'txnTypes':'income'});
    var pExpense = $.extend({}, base, {'txnTypes':'expense'});
    transaction.monthConsumeReport(pIncome, function(di){
        transaction.monthConsumeReport(pExpense, function(de){
            try{
                var arrI = isSuccessResult(di) ? ($.parseJSON(getResultData(di)||'[]')||[]) : [];
                var arrE = isSuccessResult(de) ? ($.parseJSON(getResultData(de)||'[]')||[]) : [];
                renderTrend(arrI, arrE);
            }catch(e){
                app.messager.error('Failed to parse response data.');
            }
        }, function(){ app.messager.error('Expense request failed.'); });
    }, function(){ app.messager.error('Income request failed.'); });
}

function monthCodeList(){ return ['01','02','03','04','05','06','07','08','09','10','11','12']; }
function monthNameList(){ return ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月']; }

function renderTrend(arrIncome, arrExpense){
    var mapI = {}; for(var i=0;i<arrIncome.length;i++){ var it=arrIncome[i]; mapI[getMonthCodeByName(it.key)||''] = parseFloat(it.value)||0; }
    var mapE = {}; for(var j=0;j<arrExpense.length;j++){ var jt=arrExpense[j]; mapE[getMonthCodeByName(jt.key)||''] = parseFloat(jt.value)||0; }
    var codes = monthCodeList();
    var names = monthNameList();
    var incomes = []; var expenses = []; var surplus = []; var rows = [];
    for(var k=0;k<codes.length;k++){
        var c = codes[k];
        var i = mapI[c]||0;
        var e = mapE[c]||0;
        var s = i - e;
        incomes.push(i);
        expenses.push(e);
        surplus.push(s);
        rows.push({month:names[k], income:i, expense:e, surplus:s});
    }
    $('#summaryGrid').datagrid('loadData', rows);
    echarts.dispose(document.getElementById('main'));
    var chart = echarts.init(document.getElementById('main'));
    var yearSel = safeComboboxValue('#cmbYear');
    var option = {
        title: { text: 'Income vs Expense · '+(yearSel||''), left: 'left' },
        tooltip: {
            trigger: 'axis',
            formatter: function(params){
                var pI = params.find(function(p){ return p.seriesName==='收入'; });
                var pE = params.find(function(p){ return p.seriesName==='支出'; });
                var pS = params.find(function(p){ return p.seriesName==='差额'; });
                var n = params[0].name;
                var i = pI ? pI.value : 0;
                var e = pE ? pE.value : 0;
                var s = pS ? pS.value : (i-e);
                return '月份：'+n+'<br/>收入：¥'+i+'<br/>支出：¥'+e+'<br/>差额：¥'+s;
            }
        },
        legend: { data: ['收入','支出','差额'] },
        toolbox: {
            show: true,
            feature: { dataView:{show:true,readOnly:false}, magicType:{show:true,type:['line','bar']}, restore:{show:true}, saveAsImage:{show:true} }
        },
        xAxis: [{ type:'category', boundaryGap:false, data: names }],
        yAxis: [{ type:'value', axisLabel:{ formatter:'¥{value}' }, splitArea:{ show:true } }],
        grid: { left: 40, right: 20, bottom: 80 },
        series: [
            { name:'收入', type:'line', data: incomes, itemStyle:{ color:'#10B981' }, smooth:true },
            { name:'支出', type:'line', data: expenses, itemStyle:{ color:'#EF4444' }, smooth:true },
            { name:'差额', type:'bar', data: surplus, itemStyle:{ color:'#2563EB' } }
        ]
    };
    chart.setOption(option);
    chart.on('click', function (param) {
        var idx = (typeof param.dataIndex === 'number') ? param.dataIndex : 0;
        var code = (idx>=0 && idx<codes.length) ? codes[idx] : getMonthCodeByName(param.name);
        openDialog(param.name);
        getTransactions(code);
    });
}

var dialog = "#dialog";
var datagrid = "#datagrid";
var dialogFlag = false;

function openDialog(monthName){
    $(dialog).css('display','');
    var title = 'Detail - ' + (monthName||'');
    if(!dialogFlag){
        $(dialog).dialog({ title:title, width: 860, height: 520, closed:false, cache:false, modal:true });
        dialogFlag = true;
    }else{
        $(dialog).dialog({title:title});
        $(dialog).dialog('refresh');
    }
}

function getTransactions(monthCode){
    var year = safeComboboxValue('#cmbYear');
    var lastDay = lastDayOfMonth(year, monthCode);
    var start = monthCode+'/01/'+year;
    var end = monthCode+'/'+lastDay+'/'+year;
    var week = {'transactionDateStartStr': start, 'transactionDateEndStr': end};
    var base = getParamsBase();
    var newParams = $.extend(week, base);
    $(datagrid).datagrid({
        method: 'post',
        queryParams : newParams,
        url: '/transaction/getTransactions'
    });
}
</script>
</body>
</html>
