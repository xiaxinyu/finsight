<script type="text/javascript">
var pieX = 320;
$(function(){
    $.parser.onComplete = function(){
        $('#main').height($('#chartArea').height()-40);
        pieX = $('#chartArea').width() - pieX;
        selectYear();
        statistic();
    };
});

function selectYear(){
	var now = new Date();
	var year = now.getFullYear();
	$("#cmbYear").combobox('setValue', ''+year);
    $("#cmbYear2").combobox('setValue', ''+(year-1));
}

function getParams(){
    function safeComboboxValue(sel){ var jq=$(sel); try{ var v=jq.combobox('getValue'); if(v!=null) return $.trim(v);}catch(e){} var v2=jq.val(); return v2?$.trim(v2):''; }
    function safeCombotreeValues(sel){ var jq=$(sel); try{ var arr=jq.combotree('getValues'); if(arr&&arr.length) return $.trim(arr.join(',')); }catch(e){} var v2=jq.val(); return v2?$.trim(v2):''; }
    function safeTextboxValue(sel){ var jq=$(sel); try{ return $.trim(jq.textbox('getValue')); }catch(e){ return $.trim(jq.val()||''); } }
    var year = safeComboboxValue('#cmbYear');
    var cardtype = safeComboboxValue('#cmbCardTypes');
    if(cardtype==='0') cardtype='';
    var consume = safeCombotreeValues('#cmbConsume');
    var demoArea = safeTextboxValue('#txtDemo');
    var params = {'year':year,'txnTypes':'expense','consumeID':consume,'cardTypeName':cardtype,'demoArea':demoArea};
    return params;
}

function statistic() {
	var params = getParams();
	transaction.monthConsumeReport(params, show);
}
function isSuccessResult(res){
    try{ return !!(res && app.api && app.api.normalizeResult && app.api.normalizeResult(res).ok); }catch(e){}
    return !!(res && (res.returnCode === 'success' || res.code === 20000 || res.code === 200));
}
function getResultData(res){
    try{
        if(res && app.api && app.api.normalizeResult){
            return app.api.normalizeResult(res).data;
        }
    }catch(e){}
    return res ? res.returnMessage : null;
}
function getResultMessage(res, fallback){
    try{
        if(res && app.api && app.api.normalizeResult){
            var n = app.api.normalizeResult(res);
            if(n && n.message){ return n.message; }
        }
    }catch(e){}
    return (res && res.returnMessage) ? res.returnMessage : (fallback || 'Request failed.');
}

function statisticCompare(){
    var params = getParams();
    var y2 = $('#cmbYear2').combobox('getValue')||'';
    if(!y2){ renderCompare(null); return; }
    var p2 = $.extend({}, params, {year: y2});
    transaction.monthConsumeReport(p2, function(d){
        try{
            if(isSuccessResult(d)){
                var arr = $.parseJSON(getResultData(d)||'[]')||[];
                var map = {};
                for(var i=0;i<arr.length;i++){
                    var k = getMonthCodeByName(arr[i].key);
                    if(k) map[k] = parseFloat(arr[i].value);
                }
                var codes = (render.cached && render.cached[3]) ? render.cached[3] : [];
                
                // If specific months selected for B, we need to respect that?
                // Actually, the X-axis is determined by A (targetCodes).
                // If B has Month B selected, we should probably only show B's value if it matches X-axis?
                // Or maybe the user wants to compare Month A (Jan) vs Month B (Feb).
                // If X-axis is Jan, we show Jan for A. For B, do we show Feb?
                // That would be confusing on a shared X-axis.
                // Let's assume standard behavior: B matches X-axis.
                // BUT, if user selected Month B = Feb, and X-axis = Jan, then B shows 0.
                
                var selMonthB = $('#cmbMonth2').combobox('getValue');
                
                var vals=[]; 
                for(var i=0; i<codes.length; i++){
                    var c = codes[i];
                    var v = map[c] || 0;
                    if(selMonthB && selMonthB !== c){
                        v = 0; // If Month B is selected and doesn't match current X-axis month, show 0
                    }
                    vals.push(v);
                }
                renderCompare(vals);
            }else{ renderCompare(null); }
        }catch(e){ renderCompare(null); }
    });
}

</script>

<script type="text/javascript">
 function show(data){
		if(isSuccessResult(data)){
			var json = null;
			try{
				json = $.parseJSON(getResultData(data) || '[]');
			}catch(e){
				json = null;
				app.messager.fail('Failed to parse response data.');
				return;
			}
			if(json != null){
				var rows = json;
                var selMonth = $('#cmbMonth').combobox('getValue');
                if(selMonth){
                    rows = rows.filter(function(r){ return getMonthCodeByName(r.key) === selMonth; });
                }
				var keys = [];
				var values = [];
				var markPoints = [];
				var monthCodes = [];
				for (var i = 0; i < rows.length; i++) {
					var row = rows[i];
					var key = row.key;
					var value = parseFloat(row.value);
					var display = monthNameCn(key);
					keys.push(display);
					values.push(value);
					markPoints.push({name: display, value: value ,xAxis: i, yAxis: value});
					monthCodes.push(getMonthCodeByName(key));
				}
				render(keys,values,markPoints,monthCodes);
                statisticCompare();
			} else {
				app.messager.fail(getResultMessage(data, 'Request failed.'));
			}
		}
	}

var compareValues = null;
function renderCompare(vals){ compareValues = ($.isArray(vals) && vals.length)? vals : null; render.cached && render.apply(null, render.cached); }
function render(keys,values,markPoints,monthCodes){
        render.cached = [keys,values,markPoints,monthCodes];
        ensureMainSize();
        echarts.dispose(document.getElementById('main'));
        var myChart = echarts.init(document.getElementById('main'));

        var avg = (function(){ var t=0; for(var i=0;i<values.length;i++){ t += values[i]||0; } return values.length?Math.round(t/values.length):0; })();
        var yearSel = (function(){ try{ return $.trim($('#cmbYear').combobox('getValue')||''); }catch(e){ return $.trim($('#cmbYear').val()||''); }})();
        var yearSel2 = (function(){ try{ return $.trim($('#cmbYear2').combobox('getValue')||''); }catch(e){ return $.trim($('#cmbYear2').val()||''); }})();

        var option = {
            title : {
                text: 'Monthly Consumption Comparison',
                subtext: 'Money · Year ' + (yearSel||'') + (avg?(' · Avg ¥'+avg):''),
                x:'left'
            },
			tooltip : {
				trigger : 'axis',
				formatter: function(params){
				    var p = params && params.length? params[0]: params;
				    var name = p.name;
				    var val = p.value;
				    return '月份：' + name + '<br/>金额：¥' + val;
				}
			},
			legend : {
				data : compareValues ? [ '月度总额('+yearSel+')', '月度总额('+yearSel2+')' ] : [ '月度总额' ]
			},
			toolbox : {
                show : true,
				feature : {
					dataView : {
						show : true,
						readOnly : false
					},
					magicType : {
						show : true,
						type : [ 'line', 'bar' ]
					},
					restore : {
						show : true
					},
					saveAsImage : {
						show : true
					}
				}
            },
			xAxis : [ {
				type : 'category',
				boundaryGap : false,
				data : keys,
				axisLabel: {
			            rotate: 0,
			            textStyle : {
			            	color : '#0000FF',
			            	align : 'left',
			            	fontWeight : 'bold',
			            	fontFamily : 'Arial'
			            }
			        }
				} ],
			grid: {
			    x: 40,
			    x2: 20,
			    y2: 100,
			},
			yAxis : [ {
				type : 'value',
				splitArea: { show: true }, 
				axisLabel : {
					formatter : '¥{value}'
				}
			} ],
			series : [ {
				type : 'line',
				name : compareValues ? ('月度总额('+yearSel+')') : '月度总额',
				data : values,
				itemStyle : {
					normal: {
			        	color: '#8FBC8F'
			        	}
				}
				,
				markPoint : {
					itemStyle: {
				       normal: {
				    	   color: '#2E8B57',
				           borderColor: '#4876FF',
				           borderWidth: 1
				       }
			        },
					symbolSize : 16,
					data : markPoints
				},
				markLine : {
			        itemStyle : {
			            normal: {
			                color:'#FF0000',
			                borderWidth:1,
			                borderColor:'rgba(255,0,0,1)'
			            }
			        },
					data : [ 
                        { type : 'average', name : 'Average' },
                        { xAxis: '二月', name: '春节' },
                        { xAxis: '九月', name: '中秋' },
                        { xAxis: '十一月', name: '双十一' }
                    ]
				}
			}
            ,(compareValues?{
                type:'line',
                name: '月度总额('+yearSel2+')',
                data: compareValues,
                itemStyle:{ normal:{ color:'#4169E1' } },
                smooth: true
            }:null)
            ].filter(function(x){return !!x;}),
            markArea: {
                silent: true,
                itemStyle: { color: 'rgba(255, 165, 0, 0.06)' },
                data: [
                    [{ xAxis: '一月' }, { xAxis: '三月' }],
                    [{ xAxis: '四月' }, { xAxis: '六月' }],
                    [{ xAxis: '七月' }, { xAxis: '九月' }],
                    [{ xAxis: '十月' }, { xAxis: '十二月' }]
                ]
            }
		};
        myChart.setOption(option);
        myChart.on('click', function (param) {
            var idx = (typeof param.dataIndex === 'number') ? param.dataIndex : 0;
            var code = (monthCodes && monthCodes[idx]) ? monthCodes[idx] : getMonthCodeByName(param.name);
            if(!code){ var n = idx+1; code = (n<10?('0'+n):(''+n)); }
            
            var year = yearSel;
            if(param.seriesName && yearSel2 && param.seriesName.indexOf(yearSel2) >= 0){
                year = yearSel2;
            }
            
            openDialog(param.name, year);
            getTransactions(code, year);
        });
}

function ensureMainSize(){
    var $area = $('#chartArea');
    var $main = $('#main');
    var h = $area.height();
    if(!h || h <= 40){ h = $(window).height() - 160; }
    if(h && h > 100){ $main.height(h - 40); $('#mainHeat').height(240); }
}

function monthNameCn(en){
    var map = {
        'Janunary':'一月','January':'一月','February':'二月','March':'三月','April':'四月','May':'五月','June':'六月','July':'七月','August':'八月','September':'九月','October':'十月','November':'十一月','December':'十二月'
    };
    return map[en]||en;
}

function getMonthCodeByName(en){
    var map = {
        'Janunary':'01','January':'01','一月':'01',
        'February':'02','二月':'02',
        'March':'03','三月':'03',
        'April':'04','四月':'04',
        'May':'05','五月':'05',
        'June':'06','六月':'06',
        'July':'07','七月':'07',
        'August':'08','八月':'08',
        'September':'09','九月':'09',
        'October':'10','十月':'10',
        'November':'11','十一月':'11',
        'December':'12','十二月':'12'
    };
    return map[en]||'';
}

function heatmapStatistic(){
    var year = (''+$('#cmbYear').combobox('getValue')||'').trim();
    if(!year){ return; }
    var months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
    var cardtype = ($('#cmbCardTypes').combobox('getValue')||'').trim(); if(cardtype==='0') cardtype='';
    var consume = (function(){ try{ var arr=$('#cmbConsume').combotree('getValues')||[]; return arr.join(','); }catch(e){ return ''; } })();
    var demoArea = (function(){ try{ return $.trim($('#txtDemo').textbox('getValue')||''); }catch(e){ return ''; } })();
    var allCats = {};
    var monthCatVals = {};
    var done = 0;
    for(var i=0;i<months.length;i++){
        (function(m){
            var start = m+'/01/'+year;
            var end = m+'/'+lastDayOfMonth(year,m)+'/'+year;
            var p = {'transactionDateStartStr':start,'transactionDateEndStr':end,'consumptionType':'1','txnTypes':'expense','consumeID':consume,'cardTypeName':cardtype,'demoArea':demoArea};
            transaction.consumeReport(p, function(resp){
                try{
                    var rows = $.parseJSON(getResultData(resp)||'[]')||[];
                    var list = []; for(var k=0;k<rows.length;k++){ var r=rows[k]; var v=parseFloat(r.value); if(isNaN(v)) v=0; list.push({name:r.key,value:v}); allCats[r.key]=(allCats[r.key]||0)+v; }
                    monthCatVals[m]=list;
                }catch(e){ monthCatVals[m]=[]; }
                done++; if(done===months.length){ renderHeatmap(year, months, allCats, monthCatVals); }
            }, function(){ done++; if(done===months.length){ renderHeatmap(year, months, allCats, monthCatVals); } });
        })(months[i]);
    }
}

function lastDayOfMonth(y,m){
    var yy = parseInt(y,10), mm = parseInt(m,10);
    var d = new Date(yy, mm, 0); // day 0 of next month -> last day of current month
    var dd = d.getDate();
    return (dd<10?('0'+dd):(''+dd));
}

function renderHeatmap(year, months, allCats, monthCatVals){
    var cats = Object.keys(allCats).sort(function(a,b){ return (allCats[b]||0)-(allCats[a]||0); }).slice(0,10);
    var idxMap = {}; for(var i=0;i<cats.length;i++){ idxMap[cats[i]]=i; }
    var data = [];
    for(var mi=0;mi<months.length;mi++){
        var m = months[mi];
        var arr = monthCatVals[m]||[];
        for(var j=0;j<arr.length;j++){
            var it = arr[j]; var ci = idxMap[it.name]; if(ci==null) continue;
            data.push([mi, ci, it.value]);
        }
    }
    var names = months.map(function(m){ return m; });
    var yCats = cats;
    var chart = echarts.init(document.getElementById('mainHeat'));
    chart.setOption({
        title:{ text:'Monthly Category Heat · '+year, left:'left' },
        tooltip:{ position:'top' },
        grid:{ height: '70%', y: 30, x:40 },
        xAxis:{ type:'category', data:names, splitArea:{ show:true } },
        yAxis:{ type:'category', data:yCats, splitArea:{ show:true } },
        visualMap:{ min:0, max:(function(){ var m=0; for(var i=0;i<data.length;i++){ m=Math.max(m,data[i][2]||0); } return m||1000; })(), calculable:true, orient:'horizontal', left:'center', bottom:0 },
        series:[{ name:'金额', type:'heatmap', data:data }]
    });
}

</script>

<script type="text/javascript">
var dialog = "#dialog";
var datagrid = "#datagrid";
var dialogFlag = false;

function openDialog(consumeName, year){
	$(dialog).css('display','');
	var title = 'Detail - ' + consumeName + (year ? (' ('+year+')') : '');
	if(!dialogFlag){
		$(dialog).dialog({    
		    title: title,    
		    width: 800,    
		    height: 480,    
		    closed: false,    
		    cache: false,    
		    modal: true   
		});
		dialogFlag = true;
	}else{
		$(dialog).dialog({title:title});
		$(dialog).dialog('refresh');  
	}
}

function getTransactions(month, yearInput){
	var year = yearInput || $('#cmbYear').combobox('getValue');
    var lastDay = lastDayOfMonth(year, month);
    var start = month+'/01/'+year;
    var end = month+'/'+lastDay+'/'+year;
	var week = {'transactionDateStartStr': start, 'transactionDateEndStr': end};
	var params = getParams();
	var newParams = $.extend(week,params);
	$(datagrid).datagrid({
		method: 'post',
		queryParams : newParams,
		url: '/transaction/getTransactions'
	});
}

function refreshTransactions(month){
	var year = $('#cmbYear').combobox('getValue');
    var lastDay = lastDayOfMonth(year, month);
    var start = month+'/01/'+year;
    var end = month+'/'+lastDay+'/'+year;
	var week = {'transactionDateStartStr': start, 'transactionDateEndStr': end};
	var params = getParams();
	var newParams = $.extend(week,params);
	$(datagrid).datagrid('load',newParams);
}

</script>
