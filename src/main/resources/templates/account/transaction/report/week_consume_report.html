<html>
<head>
    <title>== Weekly Summary ==</title>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.min.js"></script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.easyui.min.js"></script>
    <script type="text/javascript" src="/scripts/app-plugin.js"></script>
    <script type="text/javascript" src="/scripts/date.js"></script>
    <script type="text/javascript" src="/plugins/echarts-6.0.0/echarts.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/bootstrap/easyui.css">
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/icon.css">
    <script type="text/javascript" src="/scripts/transaction.js"></script>
    <script type="text/javascript" src="/datasource/transaction-datasource.js"></script>
    
    <link rel="stylesheet" type="text/css" href="/css/default/transaction/TransactionBill.css">
    	<script type="text/javascript"></script>
</head>
<body class="easyui-layout">
    <div data-options="region:'north'" style="height: 52px">
		<div style="margin-top: 3px;">
            <span class="item_intervel">
                <label>Year</label>
                <select id="cmbYearQuick" class="easyui-combobox" style="width:90px;"></select>
            </span>
			<span class="item_intervel">
	           	<label>Transaction date:</label> 
	           	<input id="dateStart" class="easyui-datebox" style="width: 100px;"  data-options="onSelect:statistic"/>
	           	~ 
	           	<input id="dateEnd" class="easyui-datebox" style="width: 100px;" data-options="onSelect:statistic" />
			</span>
	          
	        <span class="item_intervel">
				<label>Card type：</label>
				<input id="cmbCardTypes" class="easyui-combobox" 
					data-options="data:transaction_datasource.cardTypes,valueField:'id',textField:'text',onSelect:statistic"
					style="width: 130px;">
			</span>
	
	          <span class="item_intervel">
	          	<label>Consume type：</label> 
              <select id="cmbConsume" class="easyui-combotree" data-options="url:'/api/v1/consume/tree',method:'get',onChange:statistic" multiple 
	          	style="width:200px;"></select>
	          </span>
	          
	          <span class="item_intervel">
	          	<input id="txtDemo" class="easyui-textbox" style="width:120px"> 
	          </span>
	          
	          <span class="item_intervel">
	              <a class="easyui-linkbutton" data-options="iconCls:'icon-search'" onclick="statistic()">Statistic</a>  
	          </span>
          </div>
	</div>
	<div id="chartArea" data-options="region:'center',border:false">
		<div class="easyui-layout" fit="true">
            <div data-options="region:'north',border:false" style="height:56px;padding:6px 10px 0;">
                <div id="kpiBar" class="fs-report-kpi-bar" style="padding:0;"></div>
            </div>
	        <div data-options="region:'west',split:true" title="Week Consume" style="width:720px;">
            <div id="main" style="margin-top: 20px; width:100%; height: 360px;"></div>
	        </div>
	        <div id="detailGridArea" data-options="region:'center',title:'Detail - Monday'">
	        	<table id="datagrid"  fit="true"
					data-options="rownumbers:true,singleSelect:true,pagination:true,pageSize:50,border:false">
					<thead>
						<tr>
							<th data-options="field:'id',hidden:true">ID</th>
                            <th data-options="field:'bankCardName',width:160">Card</th>
							<th data-options="field:'transactionDate',width:80,align:'center',formatter:app.date.format">Book date</th>
							<th data-options="field:'balanceMoney',width:100,formatter:app.money.rmb">Balance money</th>
							<th data-options="field:'demoArea',width:420,align:'left'">Description</th>
						</tr>
					</thead>
				</table>
	        </div>
        </div>
	</div>
</body>	
<script type="text/javascript">
$(function(){
    $.parser.onComplete = function(){
        initYearQuick();
        ensureMainSize();
        statistic();
        getTransactions(0);
    };
});

function initYearQuick(){
    try{
        var curY = new Date().getFullYear();
        var startY = curY - 15;
        var years = [];
        for(var y = curY; y >= startY; y--){
            years.push({ value: ''+y, text: ''+y });
        }
        $('#cmbYearQuick').combobox('loadData', years);
        $('#cmbYearQuick').combobox('setValue', ''+curY);
        $('#dateStart').datebox('setValue', curY + '-01-01');
        $('#dateEnd').datebox('setValue', curY + '-12-31');
        $('#cmbYearQuick').combobox({
            onSelect: function(rec){
                var yy = rec && rec.value ? rec.value : $('#cmbYearQuick').combobox('getValue');
                if(!yy) return;
                $('#dateStart').datebox('setValue', yy + '-01-01');
                $('#dateEnd').datebox('setValue', yy + '-12-31');
                statistic();
                getTransactions(0);
            }
        });
    }catch(e){
        // ignore
    }
}

function getParams(){
    function safeDateboxValue(sel){ var jq=$(sel); try{ var v=jq.datebox('getValue'); if(v!=null) return $.trim(v);}catch(e){} var v2=jq.val(); return v2?$.trim(v2):''; }
    function safeComboboxValue(sel){ var jq=$(sel); try{ var v=jq.combobox('getValue'); if(v!=null) return $.trim(v);}catch(e){} var v2=jq.val(); return v2?$.trim(v2):''; }
    function safeCombotreeValues(sel){ var jq=$(sel); try{ var arr=jq.combotree('getValues'); if(arr&&arr.length) return $.trim(arr.join(',')); }catch(e){} var v2=jq.val(); return v2?$.trim(v2):''; }
    var dateStart = safeDateboxValue('#dateStart');
    var dateEnd = safeDateboxValue('#dateEnd');
    var cardtype = safeComboboxValue('#cmbCardTypes');
    if(cardtype==='0') cardtype='';
    var consume = safeCombotreeValues('#cmbConsume');
    var demoArea = (function(){ var jq=$('#txtDemo'); try{ return $.trim(jq.textbox('getValue')); }catch(e){ return $.trim(jq.val()||''); } })();
    var params = {'transactionDateStartStr':dateStart,'transactionDateEndStr':dateEnd,'txnTypes':'expense','consumeID':consume,'cardTypeName':cardtype,'demoArea':demoArea};
    return params;
}

function statistic() {
	var params = getParams();
	transaction.weekConsumeReport(params, show, ajaxError);
}
function isSuccessResult(res){
    try{ return !!(res && app.api && app.api.normalizeResult && app.api.normalizeResult(res).ok); }catch(e){}
    return !!(res && (res.returnCode === 'success' || res.code === 20000 || res.code === 200));
}
function getResultData(res){
    try{
        if(res && app.api && app.api.normalizeResult){
            return app.api.normalizeResult(res).data;
        }
    }catch(e){}
    return res ? res.returnMessage : null;
}
function getResultMessage(res, fallback){
    try{
        if(res && app.api && app.api.normalizeResult){
            var n = app.api.normalizeResult(res);
            if(n && n.message){ return n.message; }
        }
    }catch(e){}
    return (res && res.returnMessage) ? res.returnMessage : (fallback || 'Request failed.');
}
</script>

<script type="text/javascript">
function weekName(n){
    var arr=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
    var idx = parseInt(n);
    if(isNaN(idx) || idx<0 || idx>6) return '';
    return arr[idx];
}

function nameToIndex(name){
    var map={'星期一':0,'星期二':1,'星期三':2,'星期四':3,'星期五':4,'星期六':5,'星期日':6};
    return map[name];
}

function show(data){
    if(isSuccessResult(data)){
        var json = null;
        try{
            json = $.parseJSON(getResultData(data) || '[]');
        }catch(e){
            json = null;
            app.messager.fail('Failed to parse response data.');
            return;
        }
        if(json != null){
            var rows = json;
            var weekNames = new Array();
            var rowDatas = new Array();
            var total = 0;
            for (var i = 0; i < rows.length; i++) {
                var row = rows[i];
                var key = parseInt(row.key);
                var value = parseFloat(row.value);
                var name = weekName(key);
                weekNames.push(name);
                total += (value||0);
                rowDatas.push({name: name, value: value});
            }
            render(weekNames,rowDatas,total);
        } else { app.messager.fail(getResultMessage(data, 'Request failed.')); }
    } else {
        app.messager.fail(getResultMessage(data, 'Request failed.'));
    }
}

function ajaxError(xhr){
    var msg = (xhr && xhr.responseText) ? xhr.responseText : 'Network error';
    app.messager.error(msg);
}

function render(weekNames,rowDatas,total){
        ensureMainSize();
        var myChart = echarts.init(document.getElementById('main'));

        // KPI
        var top = rowDatas && rowDatas.length ? rowDatas[0] : {name:'',value:0};
        var share = total > 0 ? ((top.value||0) / total * 100) : 0;
        var baseKpi =
            '<span class="fs-kpi">Total Expense <b>' + app.money.rmb(total) + '</b></span>' +
            '<span class="fs-kpi">Top: <b>' + (top.name||'') + '</b> <span style="color:var(--text-disabled);">( ' + share.toFixed(1) + '% )</span></span>';
        $('#kpiBar').html(baseKpi);

        // Strict KPI: re-compute income/savings using current report filters.
        try{
            var paramsExpense = getParams(); // expense params already include current filters
            var paramsIncome = $.extend({}, paramsExpense, { txnTypes: 'income' });
            transaction.consumeReport(paramsIncome, function(incomeRes){
                if(!isSuccessResult(incomeRes)) return;
                try{
                    var rows = $.parseJSON(getResultData(incomeRes) || '[]');
                    if(!$.isArray(rows)) rows = [];
                    var incomeTotal = 0;
                    for(var i=0;i<rows.length;i++){ incomeTotal += (Number(rows[i] && rows[i].value) || 0); }

                    var expenseTotal = total;
                    var surplus = incomeTotal - expenseTotal;
                    var savingsRate = incomeTotal <= 0 ? 0 : Math.max(0, surplus / incomeTotal) * 100.0;
                    var hint = (surplus < 0)
                        ? '（逆差压力）'
                        : (savingsRate < 10)
                            ? '（储蓄偏弱）'
                            : (savingsRate < 20)
                                ? '（需收紧预算）'
                                : '（现金流稳健）';
                    var finKpi =
                        '<span class="fs-kpi">Income ' + app.money.rmb(incomeTotal) + '</span>' +
                        '<span class="fs-kpi">Expense ' + app.money.rmb(expenseTotal) + '</span>' +
                        '<span class="fs-kpi">Surplus ' + app.money.rmb(surplus) + '</span>' +
                        '<span class="fs-kpi">Savings ' + savingsRate.toFixed(1) + '%' + hint + '</span>';
                    $('#kpiBar').html(baseKpi + finKpi);
                    try{ ensureMainSize(); }catch(e){}
                }catch(e){}
            }, function(){});
        }catch(e){}

        var values = [];
        for(var i=0;i<rowDatas.length;i++){ values.push(rowDatas[i].value||0); }

        var option = {
            title : {
                text: 'Week Consume Statistic',
                subtext: 'Money',
                x:'center'
            },
		    tooltip : {
		        trigger: 'axis',
		        axisPointer: { type: 'shadow' },
		        formatter: function(params){
                    var p = params && params.length ? params[0] : null;
                    if(!p) return '';
                    var v = Number(p.value||0);
                    return p.name + '<br/>Expense: ' + app.money.rmb(v);
                }
		    },
		    legend: { show: false },
		    toolbox: {
		        show : true,
		        feature : {
		            mark : {show: true},
		            dataView : {show: true, readOnly: false},
		            magicType : {
		                show: true, 
		                type: ['line', 'bar'],
		                option: {
		                    funnel: {
		                        x: '25%',
		                        width: '50%',
		                        funnelAlign: 'left',
		                        max: 1548
		                    }
		                }
		            },
		            restore : {show: true},
		            saveAsImage : {show: true}
		        }
            },
            grid: { left: 60, right: 24, top: 60, bottom: 60 },
            xAxis : {
                type : 'category',
                data : weekNames,
                axisLabel: { rotate: 0 }
            },
            yAxis : {
                type : 'value',
                axisLabel: { formatter: function(v){ return '¥' + Number(v||0).toFixed(0); } }
            },
		    series : [
		        {
		            name:'Expense',
		            type:'bar',
		            data: values,
		            barMaxWidth: 48,
		            itemStyle: { borderRadius: [6,6,0,0] },
		            markLine : { data: [ { type: 'average', name: 'Average' } ] }
		        }
		    ]
		};
		
        myChart.setOption(option);
        myChart.on('click', function (param) {
            var idx = nameToIndex(param.name);
            refreshTransactions(idx);
            $("#detailGridArea").panel({'title':'Detail - ' + param.name});
        });
}

function ensureMainSize(){
    var $area = $('#chartArea');
    var $main = $('#main');
    var h = $area.height();
    var kpiH = $('#kpiBar').length ? $('#kpiBar').outerHeight(true) : 0;
    h = h - kpiH;
    if(!h || h <= 80){ h = $(window).height() - 160; }
    if(h && h > 120){ $main.height(h - 80); }
}
</script>

<script type="text/javascript">
var datagrid = '#datagrid';
function getTransactions(weekName){
	var week = {'weekName': weekName}
	var params = getParams();
	var newParams = $.extend(week,params);
	$(datagrid).datagrid({
		method: 'post',
		queryParams : newParams,
		url: '/transaction/getTransactions'
	});
}

function refreshTransactions(weekName){
	var week = {'weekName': weekName}
	var params = getParams();
	var newParams = $.extend(week,params);
	$(datagrid).datagrid('load',newParams);
	$("#detailGridArea").panel({'title':'Detail - ' + weekName});
}
</script>
</html>
