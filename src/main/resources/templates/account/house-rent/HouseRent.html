<html>
<head>
    <title>== HouseRent ==</title>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.min.js"></script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.easyui.min.js"></script>
    <script type="text/javascript" src="/scripts/app-plugin.js"></script>
    <script type="text/javascript" src="/scripts/date.js"></script>
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/bootstrap/easyui.css">
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/icon.css">
    <link rel="stylesheet" type="text/css" href="/css/default/transaction/TransactionBill.css">
    <script type="text/javascript">var app_url = '';</script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/datagrid-groupview.js"></script>
    <script type="text/javascript" src="/datasource/endowment-datasource.js"></script>
</head>
<body class="easyui-layout">
    <div data-options="region:'north',border:false" style="height: 56px">
        <div class="toolbar fs-toolbar" style="height:100%;">
            <span class="item_intervel fs-toolbar-group">
                <label>Date</label>
                <input id="dateStart" class="easyui-datebox" style="width: 100px;" data-options="onSelect:searchHouseRents"/>
                ~
                <input id="dateEnd" class="easyui-datebox" style="width: 100px;" data-options="onSelect:searchHouseRents"/>
            </span>

            <span class="item_intervel fs-toolbar-group">
                <label>Unit</label>
                <input id="cmbUnitName" class="easyui-combobox"
                       data-options="data:endowment_datasource.units,valueField:'id',textField:'text',editable:false,onSelect:searchHouseRents"
                       style="width: 220px;">
            </span>

            <span class="item_intervel fs-toolbar-group">
                <label>Filter</label>
                <input id="txtDemo" class="easyui-textbox" data-options="prompt:'Keyword'" style="width:140px">
            </span>

            <span class="item_intervel fs-toolbar-actions">
                <span class="fs-kpi">Rows <b id="kpiRows">0</b></span>
                <a class="easyui-linkbutton fs-btn-primary" data-options="iconCls:'icon-search'" onclick="searchHouseRents()">Query</a>
                <a class="easyui-linkbutton" data-options="iconCls:'icon-save'" onclick="">Export</a>
            </span>
        </div>
    </div>

    <div data-options="region:'center',border:false">
        <table id="datagrid" fit="true"
               data-options="rownumbers:true,singleSelect:true,pagination:true,pageSize:200,pageList:[50,100,150,200,500]">
            <thead>
            <tr>
                <th data-options="field:'id',hidden:true">ID</th>
                <th data-options="field:'year',width:80,align:'center',hidden:true">Year</th>
                <th data-options="field:'transactionDate',width:80,align:'center',formatter:app.date.format">Bookkeeping Date</th>
                <th data-options="field:'balanceMoney',width:100,formatter:app.money.rmb">Expense</th>
                <th data-options="field:'balanceCurrency',width:80,align:'center'">Currency</th>
                <th data-options="field:'transactionDesc',width:350,align:'left'">Narration</th>
                <th data-options="field:'demoArea',width:420,align:'left',editor:{type:'textbox'}">Description</th>
            </tr>
            </thead>
        </table>
    </div>
    
<script type="text/javascript">
var datagrid = '#datagrid';
var query_url = app_url + '/house-rent/getHouseRents';
var searchTimer = null;
var autoSearchReady = false;
var DEFAULT_PAGE_SIZE = 200;
function scheduleSearch(){ if(searchTimer){ clearTimeout(searchTimer); } searchTimer = setTimeout(searchHouseRents, 220); }

function formatDateMMDDYYYY(dt){
    if(!dt){ return ''; }
    var m = dt.getMonth() + 1;
    var d = dt.getDate();
    var y = dt.getFullYear();
    return (m < 10 ? ('0' + m) : m) + '/' + (d < 10 ? ('0' + d) : d) + '/' + y;
}

function ensureOneYearDateRange(startVal, endVal, startSelector, endSelector){
    var s = String(startVal || '').trim();
    var e = String(endVal || '').trim();
    if(s || e){ return {start:s, end:e}; }
    var now = new Date();
    var y = now.getFullYear();
    var ds = '01/01/' + y;
    var de = '12/31/' + y;
    try{ if($(startSelector).data('datebox')){ $(startSelector).datebox('setValue', ds); } }catch(ignore){}
    try{ if($(endSelector).data('datebox')){ $(endSelector).datebox('setValue', de); } }catch(ignore){}
    return {start:ds, end:de};
}
$(function() {
    try{
        var y = new Date().getFullYear();
        $('#dateStart').datebox('setValue', '01/01/' + y);
        $('#dateEnd').datebox('setValue', '12/31/' + y);
    }catch(e){}
    $(datagrid).datagrid({
        method:'post',
        url: query_url,
        pageSize:DEFAULT_PAGE_SIZE,
        pageList:[50,100,150,200,500],
        pageNumber:1,
        loadMsg:'Loading records...',
        fitColumns:true,
        nowrap:true,
        striped:true,
        autoRowHeight:true,
        scrollbarSize:14,
        onBeforeLoad:function(param){
            param = param || {};
            var pageNo = parseInt(param.page, 10);
            var pageSize = parseInt(param.rows, 10);
            param.page = (isNaN(pageNo) || pageNo < 1) ? 1 : pageNo;
            param.rows = (isNaN(pageSize) || pageSize < 1) ? DEFAULT_PAGE_SIZE : pageSize;
            $.extend(param, collectSearchParams());
        },
        groupField:'year',
        view: groupview,
        groupFormatter:function(value, rows){
            if(rows != null && rows.length > 0){
                var balanceMoneys = 0;
                for(var i=0;i<rows.length;i++){
                    balanceMoneys += parseFloat(rows[i].balanceMoney);
                }
            }
            var space = "&nbsp;&nbsp;&nbsp;";
            return space + "Total Pay:" + Math.round(balanceMoneys) + space + rows.length + "Item(s)";
        },
        onLoadSuccess:function(data){
            var total = (data && typeof data.total !== 'undefined') ? data.total : (((data||{}).rows||[]).length);
            $('#kpiRows').text(total);
        },
        singleSelect:true
    });
    var pager = $(datagrid).datagrid('getPager');
    pager.pagination({
        pageSize:DEFAULT_PAGE_SIZE,
        pageList:[50,100,150,200,500]
    });
    try{
        $('#txtDemo').textbox('textbox').on('input', scheduleSearch).on('keydown', function(e){ if(e.keyCode===13){ searchHouseRents(); } });
    }catch(e){}
    autoSearchReady = true;
    searchHouseRents();
});

function collectSearchParams() {
    var dateStart = '';
    var dateEnd = '';
    var demoArea = '';

    if ($('#dateStart').data('datebox')) {
        dateStart = $('#dateStart').datebox('getValue');
    }
    if ($('#dateEnd').data('datebox')) {
        dateEnd = $('#dateEnd').datebox('getValue');
    }
    var fixedRange = ensureOneYearDateRange(dateStart, dateEnd, '#dateStart', '#dateEnd');
    dateStart = fixedRange.start;
    dateEnd = fixedRange.end;
    if ($('#txtDemo').data('textbox')) {
        demoArea = $('#txtDemo').textbox('getValue');
    }

    return {
        transactionDateStartStr: dateStart,
        transactionDateEndStr: dateEnd,
        demoArea: demoArea
    };
}

function searchHouseRents(resetToFirstPage) {
    if(!autoSearchReady){ return; }
    if ($(datagrid).data('datagrid')) {
        var opts = $(datagrid).datagrid('options');
        opts.queryParams = collectSearchParams();
        if(resetToFirstPage !== false){
            $(datagrid).datagrid('getPager').pagination('select', 1);
        }else{
            $(datagrid).datagrid('reload');
        }
    }
}
</script>

</body>
</html>
