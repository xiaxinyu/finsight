<html>
<head>
    <title>== Income Ledger ==</title>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.min.js"></script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.easyui.min.js"></script>
    <script type="text/javascript" src="/scripts/app-plugin.js"></script>
    <script type="text/javascript" src="/scripts/date.js"></script>
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/bootstrap/easyui.css">
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/icon.css">
    <link rel="stylesheet" type="text/css" href="/css/default/transaction/TransactionBill.css">
    <script type="text/javascript">var app_url = '';</script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/datagrid-groupview.js"></script>
    <style>
        .datagrid-row-selected { background-color:#e6f2ff !important; }
        .datagrid-row-selected .datagrid-cell { color:#333 !important; }
        .datagrid-row-over .datagrid-cell { color:#333 !important; }
    </style>
</head>
<body class="easyui-layout">
    <div data-options="region:'north',border:false" style="height: 56px">
        <div class="toolbar fs-toolbar" style="height: 100%;">
            <span class="item_intervel fs-toolbar-group">
                <label>Date</label>
                <input id="dateStart" class="easyui-datebox" style="width: 110px;" data-options="onSelect:searchSalaries"/>
                ~
                <input id="dateEnd" class="easyui-datebox" style="width: 110px;" data-options="onSelect:searchSalaries"/>
            </span>

            <span class="item_intervel fs-toolbar-group">
                <label>Income</label>
                <select id="cmbConsume" class="easyui-combotree"
                        data-options="url:'/api/v1/consume/tree?txnType=income',method:'get',onChange:searchSalaries,multiple:true"
                        style="width:220px;"></select>
            </span>
            <span class="item_intervel fs-toolbar-group">
                <label>Quick</label>
                <select id="cmbIncomePreset" class="easyui-combobox" style="width:140px;"
                        data-options="editable:false,onSelect:function(rec){ applyIncomePreset(rec && rec.value); }">
                    <option value="">All income</option>
                    <option value="salary">Payroll</option>
                    <option value="deposit">Deposit Increase</option>
                    <option value="loan">Bank Loan</option>
                </select>
            </span>

            <span class="item_intervel fs-toolbar-group">
                <label>Filter</label>
                <input id="txtDemo" class="easyui-textbox" data-options="prompt:'Keyword'" style="width:140px">
            </span>

            <span class="item_intervel fs-toolbar-actions">
                <span class="fs-kpi">Rows <b id="kpiRows">0</b></span>
                <a class="easyui-linkbutton fs-btn-primary" data-options="iconCls:'icon-search'" onclick="searchSalaries()">Query</a>
                <a class="easyui-linkbutton" data-options="iconCls:'icon-save'" onclick="">Export</a>
            </span>
        </div>
    </div>

    <div data-options="region:'center',border:false">
        <table id="datagrid" fit="true"
               data-options="rownumbers:true,singleSelect:true,pagination:true,pageSize:100,pageList:[50,100,150,200,500]">
            <thead>
            <tr>
                <th data-options="field:'id',hidden:true">ID</th>
                <th data-options="field:'bankCardName',width:160">Card Name</th>
                <th data-options="field:'bookKeepingDate',width:90,align:'center',formatter:app.date.format">Posting Date</th>
                <th data-options="field:'transactionDate',width:90,align:'center',formatter:app.date.format">TXN Date</th>
                <th data-options="field:'transactionDesc',width:280,align:'left'">Narration</th>
                <th data-options="field:'balanceCurrency',width:70,align:'center'">Currency</th>
                <th data-options="field:'incomeMoney',width:90,align:'right',formatter:function(v,r,i){
                    var income = Number(v || 0);
                    if(income <= 0 && Number(r.balanceMoney || 0) < 0){ income = Math.abs(Number(r.balanceMoney||0)); }
                    return '<span class=&quot;fs-money-income&quot;>' + app.money.rmb(income,r,i) + '</span>';
                }">Income</th>
                <th data-options="field:'balanceMoney',width:90,align:'right',formatter:function(v,r,i){
                    var expense = Number(v || 0);
                    if(expense < 0){ expense = 0; }
                    return '<span class=&quot;fs-money-expense&quot;>' + app.money.rmb(expense,r,i) + '</span>';
                }">Expense</th>
                <th data-options="field:'accountBalance',width:95,align:'right',formatter:app.money.rmb">Balance</th>
                <th data-options="field:'consumeName',width:180,align:'left'">Category</th>
                <th data-options="field:'demoArea',width:300,align:'left'">Remarks</th>
            </tr>
            </thead>
        </table>
    </div>
    
<script type="text/javascript">
var datagrid = '#datagrid';
var query_url = app_url + '/salary/getSalarys';
var searchTimer = null;
var autoSearchReady = false;
var DEFAULT_PAGE_SIZE = 100;

function formatDateYmd(dt){
    if(!dt){ return ''; }
    var m = dt.getMonth() + 1;
    var d = dt.getDate();
    var y = dt.getFullYear();
    // EasyUI list APIs parse MM/dd/yyyy on backend.
    return (m < 10 ? ('0' + m) : m) + '/' + (d < 10 ? ('0' + d) : d) + '/' + y;
}

function ensureOneYearDateRange(dateStart, dateEnd){
    var s = (dateStart || '').trim();
    var e = (dateEnd || '').trim();
    if(s || e){
        return { dateStart: s, dateEnd: e };
    }
    var end = new Date();
    var start = new Date(end.getTime());
    start.setFullYear(start.getFullYear() - 1);
    var startVal = formatDateYmd(start);
    var endVal = formatDateYmd(end);
    try{
        if($('#dateStart').data('datebox')){ $('#dateStart').datebox('setValue', startVal); }
        if($('#dateEnd').data('datebox')){ $('#dateEnd').datebox('setValue', endVal); }
    }catch(e1){}
    return { dateStart: startVal, dateEnd: endVal };
}

function scheduleSearch(){
    if(searchTimer){ clearTimeout(searchTimer); }
    searchTimer = setTimeout(function(){ searchSalaries(); }, 220);
}

$(function() {
    // Keep behavior aligned with Transaction page: default to current-year range.
    try{
        var now = new Date();
        var y = now.getFullYear();
        $('#dateStart').datebox('setValue', y + '-01-01');
        $('#dateEnd').datebox('setValue', y + '-12-31');
    }catch(e){}

    $(datagrid).datagrid({
        method:'post',
        url: query_url,
        pageSize:DEFAULT_PAGE_SIZE,
        pageList:[50,100,150,200,500],
        pageNumber:1,
        title:'Total Income:<span id="totalIncome" class="fs-total-count">0</span>',
        loadMsg:'Loading income ledger...',
        fitColumns:false,
        nowrap:true,
        striped:true,
        autoRowHeight:true,
        scrollbarSize:14,
        groupField:'year',
        view: groupview,
        onBeforeLoad:function(param){
            // Keep paging params valid and always merge the latest filter values.
            param = param || {};
            var pageNo = parseInt(param.page, 10);
            var pageSize = parseInt(param.rows, 10);
            param.page = (isNaN(pageNo) || pageNo < 1) ? 1 : pageNo;
            param.rows = (isNaN(pageSize) || pageSize < 1) ? DEFAULT_PAGE_SIZE : pageSize;
            $.extend(param, collectSearchParams());
        },
        groupFormatter:function(value, rows){
            if(rows != null && rows.length > 0){
                var incomeTotal = 0;
                for(var i=0;i<rows.length;i++){
                    incomeTotal += parseFloat(rows[i].incomeMoney || 0);
                }
            }
            var space = "&nbsp;&nbsp;&nbsp;";
            return space + "Total Income:" + Math.round(incomeTotal) + space + rows.length + "Item(s)";
        },
        onLoadSuccess:function(data){
            var rows = (data && data.rows) ? data.rows : [];
            var total = 0;
            for(var i=0;i<rows.length;i++){
                var rv = rows[i] || {};
                var income = Number(rv.incomeMoney || 0);
                if(income <= 0 && Number(rv.balanceMoney || 0) < 0){ income = Math.abs(Number(rv.balanceMoney || 0)); }
                total += income;
            }
            $('#totalIncome').text(Math.round(total));
            $('#kpiRows').text((data && typeof data.total !== 'undefined') ? data.total : rows.length);
        },
        singleSelect:true
    });
    var pager = $(datagrid).datagrid('getPager');
    pager.pagination({
        pageSize:DEFAULT_PAGE_SIZE,
        pageList:[50,100,150,200,500]
    });

    // Trigger search on typing/enter, similar to Transaction page flow.
    try{
        $('#txtDemo').textbox('textbox').on('input', scheduleSearch).on('keydown', function(e){
            if(e.keyCode === 13){ searchSalaries(); }
        });
    }catch(e){}

    // Initial load
    autoSearchReady = true;
    searchSalaries();
});

function collectSearchParams(){
    var dateStart = '';
    var dateEnd = '';
    var demoArea = '';
    var consumeID = '';

    // Check if components are initialized before accessing them
    if ($('#dateStart').data('datebox')) {
        dateStart = $('#dateStart').datebox('getValue');
    }
    if ($('#dateEnd').data('datebox')) {
        dateEnd = $('#dateEnd').datebox('getValue');
    }
    var fixedRange = ensureOneYearDateRange(dateStart, dateEnd);
    dateStart = fixedRange.dateStart;
    dateEnd = fixedRange.dateEnd;
    if ($('#txtDemo').data('textbox')) {
        demoArea = $('#txtDemo').textbox('getValue');
    }
    if ($('#cmbConsume').data('combotree')) {
        var arr = $('#cmbConsume').combotree('getValues');
        if (arr && arr.length) {
            consumeID = arr.join(',');
        }
    }
    return {
        transactionDateStartStr: dateStart,
        transactionDateEndStr: dateEnd,
        demoArea: demoArea,
        consumeID: consumeID
    };
}

function searchSalaries(resetToFirstPage) {
    if(!autoSearchReady){ return; }
    if ($(datagrid).data('datagrid')) {
        var opts = $(datagrid).datagrid('options');
        opts.queryParams = collectSearchParams();
        if(resetToFirstPage !== false){
            // New query always starts from page 1 for predictable pagination.
            $(datagrid).datagrid('getPager').pagination('select', 1);
        }else{
            $(datagrid).datagrid('reload');
        }
    }
}

function applyIncomePreset(preset){
    var p = (preset || '').toLowerCase();
    if(!p){
        try{
            $('#cmbConsume').combotree('clear');
        }catch(e){}
        searchSalaries();
        return;
    }

    var kwMap = {
        salary: ['工资','薪','代发工资','payroll','salary'],
        deposit: ['存款增加','存款','atm存入','deposit'],
        loan: ['银行贷款','贷款','借款','loan']
    };
    var kws = kwMap[p] || [];
    if(!kws.length){
        searchSalaries();
        return;
    }

    $.get('/api/v1/consume/tree?txnType=income', function(nodes){
        try{
            var ids = [];
            function hitNode(n){
                var txt = String((n && (n.text || n.name || n.label)) || '').toLowerCase();
                var code = String((n && n.code) || '').toLowerCase();
                for(var i=0;i<kws.length;i++){
                    var w = String(kws[i] || '').toLowerCase();
                    if(!w) continue;
                    if(txt.indexOf(w)>=0 || code.indexOf(w)>=0) return true;
                }
                return false;
            }
            function collect(node){
                if(!node) return;
                var id = node.id || node.code || node.value;
                if(id) ids.push(String(id));
                var ch = node.children || node.childrens || [];
                for(var j=0;j<ch.length;j++){ collect(ch[j]); }
            }
            function walk(arr){
                if(!arr || !arr.length) return;
                for(var i=0;i<arr.length;i++){
                    var n = arr[i] || {};
                    if(hitNode(n)){
                        collect(n);
                    }
                    walk(n.children || n.childrens || []);
                }
            }
            walk(nodes || []);
            var uniq = [];
            var seen = {};
            for(var k=0;k<ids.length;k++){
                var idv = ids[k];
                if(!seen[idv]){ seen[idv] = true; uniq.push(idv); }
            }
            if(uniq.length){
                $('#cmbConsume').combotree('setValues', uniq.slice(0, 16));
            }else{
                $('#cmbConsume').combotree('clear');
            }
            searchSalaries();
        }catch(e){
            searchSalaries();
        }
    }).fail(function(){
        searchSalaries();
    });
}
</script>

</body>
</html>
