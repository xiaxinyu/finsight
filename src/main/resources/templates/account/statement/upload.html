<!DOCTYPE html>
<html>
<head>
    <title>Import — Statement</title>
    <meta charset="UTF-8">
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.min.js"></script>
    <script type="text/javascript" src="/plugins/jquery-easyui-1.11.4/jquery.easyui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/bootstrap/easyui.css">
    <link rel="stylesheet" type="text/css" href="/plugins/jquery-easyui-1.11.4/themes/icon.css">
    <link rel="stylesheet" type="text/css" href="/css/finsight-ui.css">
    <link rel="stylesheet" type="text/css" href="/css/default/transaction/TransactionBill.css">
    <script type="text/javascript" src="/scripts/date.js"></script>
    <script type="text/javascript" src="/scripts/app-plugin.js"></script>
    <script type="text/javascript" src="/scripts/finsight-ui.js"></script>
    <script type="text/javascript" src="/datasource/statement-datasource.js"></script>
    <script type="text/javascript" src="/js/statement/upload.js"></script>
    <style>
        .datagrid-row-selected { background-color:#e6f2ff !important; }
        .datagrid-row-selected .datagrid-cell { color:#333 !important; }
        .datagrid-row-over .datagrid-cell { color:#333 !important; }
    </style>
</head>
<body class="easyui-layout">
    <div data-options="region:'north',border:false" style="height:56px">
        <form id="uploadForm" enctype="multipart/form-data" style="margin:0;height:100%;">
            <input type="hidden" id="currentStatementId" name="statementId" />
            <div class="toolbar fs-toolbar fs-upload-toolbar" style="height:100%;">
                <span class="item_intervel fs-toolbar-group">
                    <label>Bank</label>
                    <input id="cmbBank" name="bankCode" class="easyui-combobox" style="width:128px;">
                </span>
                <span class="item_intervel fs-toolbar-group">
                    <label>Type</label>
                    <input id="cmbCardType" name="cardTypeCode" class="easyui-combobox" style="width:108px;">
                </span>
                <span class="item_intervel fs-toolbar-group">
                    <label>Card</label>
                    <input id="cmbCardNo" name="cardNo" class="easyui-combobox" style="width:168px;">
                </span>
                <span class="item_intervel fs-toolbar-group">
                    <label>File</label>
                    <input id="fileBill" class="easyui-filebox" name="file" data-options="prompt:'Select file',buttonText:'Browse'" style="width:min(360px, 36vw);">
                </span>
                <span class="item_intervel fs-toolbar-actions">
                    <span class="fs-kpi">Rows <b id="kpiUploadRows">0</b></span>
                    <a href="javascript:void(0)" class="easyui-linkbutton fs-btn-primary" data-options="iconCls:'icon-redo'" onclick="submitUpload()">Upload</a>
                    <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-save'" onclick="saveAll()">Commit</a>
                    <a href="javascript:void(0)" class="easyui-linkbutton" data-options="iconCls:'icon-print'" onclick="exportPreview()">Export</a>
                </span>
            </div>
        </form>
    </div>

    <div data-options="region:'center',border:false">
        <table id="dgTempUpload"></table>
    </div>
</body>
</html>
